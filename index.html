    });
    html+=`</div>`;

    // Admin: Daily match join requests
    const dailyJoinReqs=DB.requests.filter(r=>r.type==='daily_join'&&r.status==='pending');
    if(dailyJoinReqs.length){
      html+=`<div class="xcard"><div class="xcard-t">📅 Daily Match Join Requests (${dailyJoinReqs.length})</div>`;
      dailyJoinReqs.forEach(r=>{
        const team=DB.teams.find(t=>t.id===r.teamId);
        const cap=DB.users.find(u=>u.id===r.captainId);
        const m=DB.matches.find(x=>x.id===r.matchId);
        html+=`<div class="req-card">
          <div>
            <div class="req-from">📅 ${m?.label||m?.date||'Match'}</div>
            <div class="req-meta">Team: ${team?.name||'—'} (${team?.tag||'—'})</div>
            <div class="req-meta">Captain: ${cap?.name||'—'} · 📱 ${cap?.phone||'—'}</div>
            ${r.paymentId&&r.paymentId!=='FREE'?`<div class="req-meta" style="color:var(--green)">💳 Payment ID: ${r.paymentId}</div>`:r.utr?`<div class="req-meta" style="color:var(--green)">💰 UTR: ${r.utr}</div>`:r.paymentId==='FREE'?`<div class="req-meta" style="color:var(--cyan)">✓ Free Entry</div>`:`<div class="req-meta">No payment</div>`}
          </div>
          <div class="prow-acts">
            <button class="btn btn-green btn-xs" onclick="approveDailyJoin('${r.id}','${r.matchId}');pNotifications(g('mc'))">✓ APPROVE</button>
            <button class="btn btn-red btn-xs" onclick="rejectDailyJoin('${r.id}');pNotifications(g('mc'))">✗ REJECT</button>
          </div>
        </div>`;
      });
      html+=`</div>`;
    }

    // Admin: see all registrations with Payment ID
    const regsWithPayment=DB.registrations.filter(r=>r.paymentId||r.utr);
    if(regsWithPayment.length){
      html+=`<div class="xcard"><div class="xcard-t">💳 Payment Records</div>`;
      regsWithPayment.forEach(r=>{
        const t=DB.tournaments.find(x=>x.id===r.tournamentId);
        const team=DB.teams.find(x=>x.id===r.teamId);
        const pid=r.paymentId||r.utr||'—';
        const isFree=pid==='FREE';
        html+=`<div class="prow"><div class="prow-l"><div class="av av-g">₹</div><div>
          <div class="prow-name">${team?.name||'Unknown Team'}</div>
          <div class="prow-uid">Tournament: ${t?.name||'—'}</div>
          <div class="prow-uid" style="color:${isFree?'var(--cyan)':'var(--green)'}">💳 ${isFree?'FREE ENTRY':'Payment ID: '+pid}</div>
        </div></div><span class="badge b-open">${isFree?'FREE':'PAID'}</span></div>`;
      });
      html+=`</div>`;
    }
  }

  // Captain: player join requests
  if(cu.role==='captain'){
    const joinReqs=DB.requests.filter(r=>r.toUserId===cu.id&&r.type==='player_request'&&r.status==='pending');
    const mt=DB.teams.find(t=>t.captainId===cu.id);
    html+=`<div class="xcard"><div class="xcard-t">📩 Player Join Requests (${joinReqs.length})</div>`;
    if(!joinReqs.length){html+=`<div style="color:var(--muted);font-family:var(--font-mono);font-size:10px;letter-spacing:2px">// NO PENDING REQUESTS</div>`;}
    else joinReqs.forEach(r=>{
      const u=DB.users.find(x=>x.id===r.fromUserId);
      html+=`<div class="req-card"><div><div class="req-from">🎮 ${u?.name||'Unknown'}</div><div class="req-meta">IGN: ${u?.ign||'—'} · UID: ${u?.uid||'—'}</div><div class="req-meta">Wants to join your team${mt?' — '+mt.name:''}</div></div>
        <div class="prow-acts"><button class="btn btn-green btn-xs" onclick="acceptJoin('${r.id}')">ACCEPT</button><button class="btn btn-red btn-xs" onclick="rejectReq('${r.id}')">REJECT</button></div></div>`;
    });
    html+=`</div>`;

    // Captain can invite players
    html+=`<div class="xcard"><div class="xcard-t">📤 Invite Players to Team</div>`;
    const available=DB.users.filter(u=>u.role==='player'&&!u.teamId&&u.id!==cu.id&&!DB.requests.find(r=>r.fromUserId===cu.id&&r.toUserId===u.id&&r.type==='captain_invite'&&r.status==='pending'));
    if(!available.length){html+=`<div style="color:var(--muted);font-family:var(--font-mono);font-size:10px;letter-spacing:2px">// NO AVAILABLE PLAYERS</div>`;}
    else available.forEach(p=>{
      html+=`<div class="prow"><div class="prow-l"><div class="av av-c">${p.name[0]}</div>
        <div><div class="prow-name">${p.name}</div><div class="prow-uid">IGN: ${p.ign} · UID: ${p.uid}</div></div>
      </div><button class="btn btn-cyan btn-xs" onclick="sendInvite('${p.id}')">SEND INVITE</button></div>`;
    });
    html+=`</div>`;
  }

  // Player: team invites + role request
  if(cu.role==='player'){
    const invites=DB.requests.filter(r=>r.toUserId===cu.id&&r.type==='captain_invite'&&r.status==='pending');
    html+=`<div class="xcard"><div class="xcard-t">📬 Team Invites (${invites.length})</div>`;
    if(!invites.length){html+=`<div style="color:var(--muted);font-family:var(--font-mono);font-size:10px;letter-spacing:2px">// NO INVITES YET</div>`;}
    else invites.forEach(r=>{
      const cap=DB.users.find(x=>x.id===r.fromUserId);
      const team=DB.teams.find(t=>t.captainId===r.fromUserId);
      html+=`<div class="req-card"><div><div class="req-from">👑 ${cap?.name||'Captain'} invited you!</div><div class="req-meta">Team: ${team?.name||'—'} · Tag: ${team?.tag||'—'}</div><div class="req-meta">Captain IGN: ${cap?.ign||'—'}</div></div>
        <div class="prow-acts"><button class="btn btn-green btn-xs" onclick="acceptInvite('${r.id}')">JOIN</button><button class="btn btn-red btn-xs" onclick="rejectReq('${r.id}')">DECLINE</button></div></div>`;
    });
    html+=`</div>`;

    // Player can request to join specific captains
    const alreadyInTeam=DB.teams.find(t=>t.members.includes(cu.id));
    if(!alreadyInTeam){
      const captains=DB.users.filter(u=>u.role==='captain'&&!DB.requests.find(r=>r.fromUserId===cu.id&&r.toUserId===u.id&&r.type==='player_request'&&r.status==='pending'));
      html+=`<div class="xcard"><div class="xcard-t">📤 Request to Join a Team</div>`;
      if(!captains.length){html+=`<div style="color:var(--muted);font-family:var(--font-mono);font-size:10px;letter-spacing:2px">// NO CAPTAINS AVAILABLE</div>`;}
      else captains.forEach(c=>{
        const team=DB.teams.find(t=>t.captainId===c.id);
        if(!team)return;
        html+=`<div class="prow"><div class="prow-l"><div class="av av-p">${c.name[0]}</div>
          <div><div class="prow-name">${team.name} <span class="team-tag-sm" style="font-size:8px">${team.tag}</span></div><div class="prow-uid">Captain: ${c.name} · Members: ${team.members.length}/6</div></div>
        </div><button class="btn btn-purple btn-xs" onclick="sendJoinReq('${c.id}')">REQUEST JOIN</button></div>`;
      });
      html+=`</div>`;
    }

    // Role switch request
    html+=`<div class="xcard"><div class="xcard-t">🔄 Role Options</div>
      <p style="color:var(--muted);font-size:13px;margin-bottom:10px">Currently: <span class="nav-role r-player">PLAYER</span></p>
      ${DB.requests.find(r=>r.fromUserId===cu.id&&r.type==='role_change'&&r.status==='pending')
        ?`<div style="color:var(--gold);font-family:var(--font-mono);font-size:11px;letter-spacing:1px">⏳ CAPTAIN REQUEST PENDING ADMIN APPROVAL</div>`
        :`<button class="btn btn-purple btn-sm" onclick="requestCapt()">👑 REQUEST CAPTAIN ROLE</button>`}
    </div>`;
  }

  // Captain: role back to player
  if(cu.role==='captain'){
    html+=`<div class="xcard"><div class="xcard-t">🔄 Role Options</div>
      <p style="color:var(--muted);font-size:13px;margin-bottom:10px">Currently: <span class="nav-role r-captain">CAPTAIN</span></p>
      <button class="btn btn-ghost btn-sm" onclick="requestPlayerRole()">🎮 SWITCH BACK TO PLAYER</button>
    </div>`;
  }

  html+=`</div>`;el.innerHTML=html;
}

// ── REQUEST FUNCTIONS ──
function sendInvite(playerId){
  if(DB.requests.find(r=>r.fromUserId===cu.id&&r.toUserId===playerId&&r.type==='captain_invite'&&r.status==='pending')){showToast('⚠ INVITE ALREADY SENT',true);return;}
  DB.requests.push({id:'req'+Date.now(),fromUserId:cu.id,toUserId:playerId,type:'captain_invite',status:'pending',at:Date.now()});
  DB.save();showToast('✓ INVITE SENT',false,'ok');pNotifications(g('mc'));
}
function sendJoinReq(captainId){
  if(DB.requests.find(r=>r.fromUserId===cu.id&&r.toUserId===captainId&&r.type==='player_request'&&r.status==='pending')){showToast('⚠ REQUEST ALREADY SENT',true);return;}
  DB.requests.push({id:'req'+Date.now(),fromUserId:cu.id,toUserId:captainId,type:'player_request',status:'pending',at:Date.now()});
  DB.save();showToast('✓ JOIN REQUEST SENT',false,'ok');pNotifications(g('mc'));
}
function acceptInvite(reqId){
  const req=DB.requests.find(x=>x.id===reqId);if(!req)return;
  if(cu.teamId){showToast('⚠ ALREADY IN A TEAM',true);return;}
  const team=DB.teams.find(t=>t.captainId===req.fromUserId);
  if(!team){showToast('⚠ TEAM NOT FOUND',true);return;}
  if(team.members.length>=6){showToast('⚠ TEAM IS FULL',true);return;}
  if(!team.members.includes(cu.id)){team.members.push(cu.id);}
  cu.teamId=team.id;req.status='accepted';
  // reject other invites for this player
  DB.requests.filter(r=>r.toUserId===cu.id&&r.type==='captain_invite'&&r.status==='pending'&&r.id!==reqId).forEach(r=>r.status='rejected');
  DB.save();updateNotifBadge();buildSidebar();showToast('✓ JOINED TEAM: '+team.name,false,'ok');pNotifications(g('mc'));
}
function acceptJoin(reqId){
  const req=DB.requests.find(x=>x.id===reqId);if(!req)return;
  const player=DB.users.find(x=>x.id===req.fromUserId);
  if(!player){showToast('⚠ PLAYER NOT FOUND',true);return;}
  if(player.teamId){showToast('⚠ PLAYER ALREADY IN A TEAM',true);return;}
  const team=DB.teams.find(t=>t.captainId===cu.id);
  if(!team){showToast('⚠ CREATE YOUR TEAM FIRST',true);return;}
  if(team.members.length>=6){showToast('⚠ TEAM FULL',true);return;}
  if(!team.members.includes(player.id)){team.members.push(player.id);}
  player.teamId=team.id;req.status='accepted';
  DB.save();updateNotifBadge();buildSidebar();showToast('✓ '+player.name+' JOINED YOUR TEAM',false,'ok');pNotifications(g('mc'));
}
function approveRole(reqId){
  const req=DB.requests.find(x=>x.id===reqId);if(!req)return;
  const u=DB.users.find(x=>x.id===req.fromUserId);
  if(!u)return;
  // Update role to captain
  u.role='captain';
  u.joinedRole='captain';
  req.status='approved';
  // Player stays in their current team (if any) — no removal
  // teamId unchanged — profile updates correctly
  DB.save();
  // Notify the player
  DB.requests.push({id:'notif'+Date.now(),type:'role_approved',toUserId:u.id,fromUserId:'admin1',status:'unread',at:Date.now(),
    title:'👑 Captain Role Approved!',body:'You are now a Captain. You can create and manage a team.'});
  DB.save();
  updateNotifBadge();
  buildSidebar();
  showToast('✓ CAPTAIN APPROVED — '+u.name,false,'ok');
  pNotifications(g('mc'));
}
function rejectReq(reqId){const req=DB.requests.find(x=>x.id===reqId);if(req){req.status='rejected';DB.save();updateNotifBadge();buildSidebar();showToast('REQUEST REJECTED');pNotifications(g('mc'));}}
function requestCapt(){
  if(DB.requests.find(r=>r.fromUserId===cu.id&&r.type==='role_change'&&r.status==='pending')){showToast('⚠ REQUEST ALREADY PENDING',true);return;}
  DB.requests.push({id:'req'+Date.now(),fromUserId:cu.id,toUserId:'admin1',type:'role_change',status:'pending',at:Date.now()});
  DB.save();updateNotifBadge();buildSidebar();showToast('✓ REQUEST SENT TO ADMIN',false,'ok');pNotifications(g('mc'));
}
function requestPlayerRole(){
  openMo(`<button class="mo-close" onclick="closeMo()">✕</button>
    <div class="mo-title">🔄 Switch to Player</div>
    <p style="color:var(--muted);font-size:14px;margin-bottom:14px">Switching to Player will remove your captain privileges. Your team will remain but you won't be able to manage it.</p>
    <button class="btn btn-orange btn-full" onclick="doSwitchToPlayer()">⚡ CONFIRM SWITCH</button>`);
}
function doSwitchToPlayer(){cu.role='player';DB.save();closeMo();showToast('✓ SWITCHED TO PLAYER',false,'ok');g('nav-rl').textContent='PLAYER';g('nav-rl').className='nav-role r-player';buildSidebar();nav('dashboard');}

      <div class="xcard" style="max-width:440px">

function openExchange(oldId){
  const avail=DB.users.filter(u=>u.role==='player'&&!u.teamId&&u.id!==cu.id);
  if(!avail.length){showToast('⚠ NO FREE PLAYERS',true);return;}
  openMo(`<button class="mo-close" onclick="closeMo()">✕</button><div class="mo-title">🔄 EXCHANGE PLAYER</div>
    ${avail.map(p=>`<div class="prow"><div class="prow-l"><div class="av av-g">${p.name[0]}</div><div><div class="prow-name">${p.name}</div><div class="prow-uid">IGN: ${p.ign}</div></div></div><button class="btn btn-gold btn-sm" onclick="doExchange('${oldId}','${p.id}')">SWAP</button></div>`).join('')}`);
}
function doExchange(oldId,newId){
  const t=DB.teams.find(x=>x.captainId===cu.id),op=DB.users.find(x=>x.id===oldId),np=DB.users.find(x=>x.id===newId);
  if(!t||!op||!np)return;
  t.members=t.members.filter(i=>i!==oldId);op.teamId=null;
  t.members.push(newId);np.teamId=t.id;
  DB.save();closeMo();showToast('✓ PLAYER EXCHANGED',false,'ok');nav('my-team');
}
function rmPl(pid){const t=DB.teams.find(x=>x.captainId===cu.id),p=DB.users.find(x=>x.id===pid);if(!t||!p)return;if(pid===cu.id){showToast('⚠ CANNOT REMOVE CAPTAIN',true);return;}t.members=t.members.filter(i=>i!==pid);p.teamId=null;DB.save();showToast('REMOVED');nav('my-team');}

          </div>

            ?`<button class="btn btn-green btn-xs" onclick="unbanTeamFromMatch('${m.id}','${t.id}')">✓ UNBAN</button>`
            :`<button class="btn btn-red btn-xs" onclick="banTeamFromMatch('${m.id}','${t.id}')">🚫 BAN</button>`}
        </div>`;
      }).join('')}
    </div>`);
}

function banTeamFromMatch(matchId, teamId){
  const m=DB.matches.find(x=>x.id===matchId);if(!m)return;
  if(!m.bannedTeams)m.bannedTeams=[];
  if(!m.bannedTeams.includes(teamId)) m.bannedTeams.push(teamId);
  // Remove from approved list too
  m.brTeamIds=(m.brTeamIds||[]).filter(id=>id!==teamId);
  // Reject their join request
  DB.requests.filter(r=>r.type==='daily_join'&&r.matchId===matchId&&r.teamId===teamId).forEach(r=>r.status='rejected');
  // Notify captain
  const team=DB.teams.find(t=>t.id===teamId);
  if(team){
    DB.requests.push({id:'notif'+Date.now(),type:'match_result',toUserId:team.captainId,fromUserId:'admin1',status:'unread',at:Date.now(),
      title:'🚫 Banned from Daily Match',
      body:`Tumhari team "${team.name}" ko "${m.label||m.date||'Daily Match'}" se ban kar diya gaya. Aaj ke saare daily matches ke liye ban applicable hai.`
    });
  }
  // Ban from ALL today's daily matches
  const matchDate=m.date;
  DB.matches.filter(x=>(x.matchType==='DAILY'||x.matchType==='daily')&&x.date===matchDate&&x.id!==matchId).forEach(otherMatch=>{
    if(!otherMatch.bannedTeams)otherMatch.bannedTeams=[];
    if(!otherMatch.bannedTeams.includes(teamId)) otherMatch.bannedTeams.push(teamId);
    otherMatch.brTeamIds=(otherMatch.brTeamIds||[]).filter(id=>id!==teamId);
  });
  DB.save();showToast(`🚫 ${team?.name||'TEAM'} BANNED FOR TODAY`,true);adminDailyBanMenu(matchId);
}

function unbanTeamFromMatch(matchId, teamId){
  const m=DB.matches.find(x=>x.id===matchId);if(!m)return;
  m.bannedTeams=(m.bannedTeams||[]).filter(id=>id!==teamId);
  // Unban from today's other matches too
  const matchDate=m.date;
  DB.matches.filter(x=>(x.matchType==='DAILY'||x.matchType==='daily')&&x.date===matchDate&&x.id!==matchId).forEach(otherMatch=>{
    otherMatch.bannedTeams=(otherMatch.bannedTeams||[]).filter(id=>id!==teamId);
  });
  DB.save();showToast('✓ UNBANNED',false,'ok');adminDailyBanMenu(matchId);
}

function doTransferCaptain(teamId,newCapId){
  const team=DB.teams.find(x=>x.id===teamId);
  const oldCapId=team.captainId;
  const newCap=DB.users.find(x=>x.id===newCapId);
  const oldCap=DB.users.find(x=>x.id===oldCapId);
  // Swap roles
  team.captainId=newCapId;
  team.members=team.members.filter(id=>id!==newCapId);
  team.members.push(oldCapId);
  if(newCap){newCap.role='captain';}
  if(oldCap&&oldCap.role==='captain'){oldCap.role='player';}
  DB.save();closeMo();showToast('✓ CAPTAINSHIP TRANSFERRED',false,'ok');nav('my-team');
}

// ── TEAM CHAT (clears every hour) ──
function openTeamChat(){
  const mt=DB.teams.find(t=>t.captainId===cu.id)||DB.teams.find(t=>t.members.includes(cu.id));
  if(!mt){showToast('⚠ NOT IN A TEAM',true);return;}
  const chatKey='chat_'+mt.id;
  if(!DB._d.chat)DB._d.chat={};
  if(!DB._d.chat[chatKey])DB._d.chat[chatKey]={msgs:[],created:Date.now()};
  // Clear if older than 1 hour
  const chatData=DB._d.chat[chatKey];
  const oneHour=60*60*1000;
  if(Date.now()-chatData.created>oneHour){chatData.msgs=[];chatData.created=Date.now();DB.save();}
  const msgs=chatData.msgs;
  const timeLeft=Math.max(0,Math.round((oneHour-(Date.now()-chatData.created))/60000));
  openMo(`<button class="mo-close" onclick="closeMo()">✕</button>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <div class="mo-title" style="margin-bottom:0">💬 TEAM CHAT — ${mt.name}</div>
      <div style="font-family:'Roboto Mono',monospace;font-size:9px;color:#607d8b">Clears in ~${timeLeft}m</div>
    </div>
    <div id="chat-msgs" style="max-height:260px;overflow-y:auto;margin-bottom:12px;display:flex;flex-direction:column;gap:6px;">

            <div style="background:${isMe?'rgba(26,111,255,0.15)':'rgba(255,255,255,0.05)'};border:1px solid ${isMe?'rgba(26,111,255,0.3)':'rgba(255,255,255,0.08)'};padding:7px 12px;max-width:80%;font-size:13px;border-radius:4px">${msg.text}</div>

      <input class="fi" id="chat-inp" placeholder="Type message..." style="margin-bottom:0;flex:1" onkeydown="if(event.key==='Enter')sendChat('${mt.id}')"/>

function sendChat(teamId){

// Dynamic point table with custom columns
let _ptCols=['Team','W','L','K','Pts'];
let _ptRowData=[];

function openCreatePointTable(){
  _ptCols=['Team','W','L','K','Pts'];
  _ptRowData=[];
  renderPTBuilder();
}

function renderPTBuilder(editKey){
  const pt=editKey?DB._d.pointTables[editKey]:null;
  if(pt){_ptCols=[...pt.cols];_ptRowData=pt.rows.map(r=>[...r]);}
  openMo(`<button class="mo-close" onclick="closeMo()">✕</button>
    <div class="mo-title">${editKey?'✏ EDIT':'+ CREATE'} POINT TABLE</div>
    <label class="fl">Table Name</label>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <div style="font-family:'Roboto Mono',monospace;font-size:10px;color:#607d8b">COLUMNS</div>
      <button class="btn btn-cyan btn-xs" onclick="addPTCol()">+ ADD COLUMN</button>
    </div>
    <div id="pt-cols-wrap" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
      ${_ptCols.map((c,i)=>`<div style="display:flex;align-items:center;gap:4px;background:#111;border:1px solid rgba(26,111,255,0.2);padding:4px 8px;border-radius:3px">
        <input style="background:none;border:none;color:#fff;font-size:12px;width:${Math.max(40,c.length*10)}px;outline:none;font-family:'Inter',sans-serif" value="${c}" onchange="_ptCols[${i}]=this.value"/>
        ${i>0?`<span onclick="_ptCols.splice(${i},1);_ptRowData.forEach(r=>r.splice(${i},1));renderPTBuilder(${editKey?`'${editKey}'`:'undefined'})" style="cursor:pointer;color:#f44336;font-size:14px;line-height:1">×</span>`:''}
      </div>`).join('')}
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <div style="font-family:'Roboto Mono',monospace;font-size:10px;color:#607d8b">ROWS (${_ptRowData.length})</div>
      <button class="btn btn-green btn-xs" onclick="addPTRow()">+ ADD ROW</button>
    </div>
    <div id="pt-rows-wrap" style="max-height:220px;overflow-y:auto">
      ${_ptRowData.map((row,ri)=>`<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px">
        ${row.map((cell,ci)=>`<input class="fi" style="flex:${ci===0?2:1};margin-bottom:0;padding:7px 10px;font-size:13px" value="${cell}" placeholder="${_ptCols[ci]||''}" onchange="_ptRowData[${ri}][${ci}]=this.value"/>`).join('')}
        <button class="btn btn-red btn-xs" onclick="_ptRowData.splice(${ri},1);renderPTBuilder(${editKey?`'${editKey}'`:'undefined'})">×</button>
      </div>`).join('')}
    </div>
    <button class="btn btn-cyan btn-full" style="margin-top:14px" onclick="savePTBuilder(${editKey?`'${editKey}'`:'null'})">⚡ SAVE TABLE</button>`);
}

function addPTCol(){
  const name=prompt('Column name (e.g. Deaths, Assists):');
  if(!name)return;
  _ptCols.push(name.trim());
  _ptRowData.forEach(r=>r.push('0'));
  // Re-render col section only
  const wrap=g('pt-cols-wrap');
  if(wrap) wrap.innerHTML=_ptCols.map((c,i)=>`<div style="display:flex;align-items:center;gap:4px;background:#111;border:1px solid rgba(26,111,255,0.2);padding:4px 8px;border-radius:3px">
    <input style="background:none;border:none;color:#fff;font-size:12px;width:${Math.max(40,c.length*10)}px;outline:none;font-family:'Inter',sans-serif" value="${c}" onchange="_ptCols[${i}]=this.value"/>
    ${i>0?`<span onclick="_ptCols.splice(${i},1);_ptRowData.forEach(r=>r.splice(${i},1));renderPTBuilder()" style="cursor:pointer;color:#f44336;font-size:14px;line-height:1">×</span>`:''}
  </div>`).join('');
}

function addPTRow(){
  _ptRowData.push(_ptCols.map((_,i)=>i===0?'Team Name':'0'));
  const wrap=g('pt-rows-wrap');
  if(wrap){
    const ri=_ptRowData.length-1;
    const div=document.createElement('div');
    div.style.cssText='display:flex;gap:6px;align-items:center;margin-bottom:6px';
    div.innerHTML=_ptRowData[ri].map((cell,ci)=>`<input class="fi" style="flex:${ci===0?2:1};margin-bottom:0;padding:7px 10px;font-size:13px" value="${cell}" placeholder="${_ptCols[ci]||''}" onchange="_ptRowData[${ri}][${ci}]=this.value"/>`).join('')+
      `<button class="btn btn-red btn-xs" onclick="this.parentElement.remove();_ptRowData.splice(${ri},1)">×</button>`;
    wrap.appendChild(div);
  }
}

function savePTBuilder(editKey){
  const name=v('pt-nm');
  if(!name){showToast('⚠ TABLE NAME REQUIRED',true);return;}
  if(!_ptRowData.length){showToast('⚠ ADD AT LEAST ONE ROW',true);return;}
  if(!DB._d.pointTables)DB._d.pointTables={};
  const key=editKey&&editKey!=='null'?editKey:'pt_'+Date.now();
  DB._d.pointTables[key]={name,cols:_ptCols,rows:_ptRowData,createdAt:DB._d.pointTables[key]?.createdAt||Date.now()};
  DB.save();closeMo();showToast('✓ TABLE SAVED',false,'ok');pPointTable(g('mc'));
}
function deletePointTable(key){if(!confirm('Delete table?'))return;delete DB._d.pointTables[key];DB.save();showToast('DELETED');pPointTable(g('mc'));}

function adminRemovePlayer(teamId,playerId){
  const t=DB.teams.find(x=>x.id===teamId);
  const p=DB.users.find(x=>x.id===playerId);
  if(!t||!p)return;
  if(playerId===t.captainId){showToast('⚠ CAPTAIN KO REMOVE NAHI KAR SAKTE — PEHLE CAPTAIN BADLO',true);return;}
  t.members=t.members.filter(id=>id!==playerId);
  p.teamId=null;
  DB.save();
  showToast(`✓ ${p.name} REMOVED`,false,'ok');
  _renderAdminTeamEdit(teamId);
}
function adminMakeCaptain(teamId,newCapId){
  const t=DB.teams.find(x=>x.id===teamId);
  const oldCap=DB.users.find(u=>u.id===t.captainId);
  const newCap=DB.users.find(u=>u.id===newCapId);
  if(!t||!newCap)return;
  // Demote old captain → player, keep in members
  if(oldCap){oldCap.role='player';}
  if(!t.members.includes(t.captainId)) t.members.push(t.captainId);
  // Promote new captain
  t.captainId=newCapId;
  newCap.role='captain';
  // Remove new captain from members list (captain is separate)
  t.members=t.members.filter(id=>id!==newCapId);
  DB.save();
  showToast(`👑 ${newCap.name} AB CAPTAIN HAI`,false,'ok');
  _renderAdminTeamEdit(teamId);
}

function pMatches_OLD(el){
  // Get tournaments + seasons
  const allContainers=[
    ...DB.tournaments.map(t=>({...t,containerType:'tournament'})),
    ...DB.seasons.map(s=>({...s,containerType:'season'}))
  ];

  // ── DAILY matches: show in profile, NOT here ──
  // Admin: exclude daily from this page
  // Captain/Player: show only their tournament matches here (daily = profile page)
  const nonDailyMatches=(DB.matches||[]).filter(m=>
    m.matchType!=='DAILY'&&m.matchType!=='daily'&&m.matchType!=='daily_match'
  );

  let html=`<div style="animation:pageIn .35s ease">
    <div class="sec-hd">
      <div class="sec-title"><div class="sec-bar"></div>MATCH MANAGER</div>
      ${cu.role==='admin'?`<button class="btn btn-cyan btn-sm" onclick="openAddMatchType()">+ NEW MATCH</button>`:''}
    </div>`;

  if(!nonDailyMatches.length){
    html+=`<div style="text-align:center;padding:50px;color:var(--muted);font-family:var(--font-mono);font-size:10px;letter-spacing:2px">// NO MATCHES CREATED YET<br><br>${cu.role==='admin'?'Click + NEW MATCH to create one':'Admin will schedule matches soon'}</div>`;
    el.innerHTML=html+'</div>';return;
  }

  // Group matches by tournament/season
  const grouped={};
  nonDailyMatches.forEach(m=>{
    const key=m.containerId||'general';
    if(!grouped[key])grouped[key]=[];
    grouped[key].push(m);
  });

  // For captain/player — show only their matches
  const myTeam=DB.teams.find(t=>t.captainId===cu.id||t.members.includes(cu.id));

  // Captain/Player: also show daily matches they've registered for
  if(cu.role!=='admin' && myTeam){
    const myDailyMatches=(DB.matches||[]).filter(m=>{
      const isD=m.matchType==='DAILY'||m.matchType==='daily';
      if(!isD) return false;
      return DB.requests.some(r=>r.type==='daily_join'&&r.matchId===m.id&&r.teamId===myTeam.id&&r.status==='approved');
    });
    if(myDailyMatches.length){
      html+=`<div class="xcard" style="margin-bottom:18px">
        <div style="font-family:var(--font-hd);font-size:13px;letter-spacing:2px;color:var(--green);margin-bottom:14px">📅 MY DAILY MATCHES</div>`;
      myDailyMatches.forEach(m=>{ html+=renderMatchBlock(m, cu.role, myTeam); });
      html+=`</div>`;
    }
  }

  Object.keys(grouped).forEach(key=>{
    const groupMatches=grouped[key];
    const container=allContainers.find(c=>c.id===key);
    const groupName=container?container.name:'General Matches';

    // filter for non-admin
    const visibleMatches = cu.role==='admin' ? groupMatches :
      groupMatches.filter(m=> myTeam && (m.team1Id===myTeam.id || m.team2Id===myTeam.id || (m.brTeamIds||[]).includes(myTeam.id)));

    if(visibleMatches.length===0 && cu.role!=='admin') return;

    html+=`<div class="xcard" style="margin-bottom:18px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <div class="xcard-t" style="margin-bottom:0">${container?.containerType==='season'?'⭐':'🏆'} ${groupName}</div>
        <span class="badge ${container?.status==='active'||container?.status==='open'?'b-open':'b-closed'}">${(container?.status||'active').toUpperCase()}</span>
      </div>`;

    // Group by round
    const rounds=[...new Set(visibleMatches.map(m=>m.round||'Round 1'))];
    rounds.forEach(round=>{
      const roundMatches=visibleMatches.filter(m=>(m.round||'Round 1')===round);
      html+=`<div style="margin-bottom:14px">
        <div style="font-family:var(--font-mono);font-size:9px;color:var(--purple);letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:8px">
          <div style="width:20px;height:1px;background:var(--purple);opacity:.5"></div>${round}<div style="flex:1;height:1px;background:var(--purple);opacity:.2"></div>
        </div>`;
      roundMatches.forEach(m=>{ html+=renderMatchBlock(m, cu.role, myTeam); });
      html+=`</div>`;
    });
    html+=`</div>`;
  });

  el.innerHTML=html+'</div>';
}

function renderMatchBlock(m, role, myTeam){
  const _mbg = cardBgStyle('match_card_default','match_'+m.id);
  const t1=DB.teams.find(x=>x.id===m.team1Id);

  const isBR = m.matchType==='BR';
  const isDaily = m.matchType==='DAILY';
  const isMyMatch=myTeam&&!isDaily&&(m.team1Id===myTeam.id||m.team2Id===myTeam.id||(m.brTeamIds||[]).includes(myTeam.id));
  const accentColor = m.result ? 'var(--gold)' : m.roomReleased ? 'var(--green)' : isDaily ? 'var(--green)' : 'var(--muted2)';
  const typeBadgeClass = isBR?'mt-br':isDaily?'mt-daily':'mt-cs';
  const typeBadgeLabel = isBR?'🎯 BATTLE ROYALE':isDaily?'📅 DAILY MATCH':'⚔ CS STYLE';
  const isMultiTeam = isBR;

  let roomSection='';
  if(role==='admin'){
    roomSection=`<div class="match-info-row" style="flex-wrap:wrap;gap:8px;border-top:1px solid rgba(255,255,255,0.04);padding:10px 16px">
      ${m.roomReleased
        ?`<div style="flex:1"><div class="room-lbl">ROOM ID</div><div class="room-id-val">${m.roomId||'—'}</div></div>
           <div style="flex:1"><div class="room-lbl">PASSWORD</div><div class="room-pw-val">${m.roomPass||'—'}</div></div>
           <button class="btn btn-red btn-xs" onclick="toggleRoom('${m.id}',false)">🔒 LOCK</button>`
        :`<div style="font-family:var(--font-mono);font-size:10px;color:var(--muted)">Room: <span style="color:var(--red)">🔒 LOCKED</span></div>
          <button class="btn btn-green btn-xs" onclick="toggleRoom('${m.id}',true)">🔓 RELEASE</button>`}
      ${isDaily?`<button class="btn btn-cyan btn-xs" onclick="openDailyJoinRequests('${m.id}')">📋 JOIN REQUESTS</button>`:''}
      ${!m.result?`<button class="btn btn-gold btn-xs" onclick="openSetResult('${m.id}')">SET RESULT</button>`:''}
      <button class="btn btn-ghost btn-xs" onclick="openEditMatch('${m.id}')">✏ EDIT</button>
      <button class="btn btn-red btn-xs" onclick="deleteMatch2('${m.id}')">DEL</button>
    </div>`;
  } else if(isDaily){
    // Daily match — show join button or status for captain
    const mt=myTeam;
    if(mt&&mt.captainId===cu.id){
      const existReq=DB.requests.find(r=>r.type==='daily_join'&&r.matchId===m.id&&r.teamId===mt.id);
      if(existReq){
        const statusMap={pending:'⏳ JOIN REQUEST PENDING',approved:'✓ APPROVED — Room details mein dekho',rejected:'✗ REJECTED — Admin se contact karo'};
        const badgeMap={pending:'b-ongoing',approved:'b-open',rejected:'b-closed'};
        roomSection=`<div style="padding:0 16px 12px"><span class="badge ${badgeMap[existReq.status]||'b-ongoing'}">${statusMap[existReq.status]||existReq.status}</span></div>`;
        if(existReq.status==='approved'&&m.roomReleased){
          roomSection+=`<div class="room-unlocked" style="margin:0 16px 12px">
            <div style="display:flex;gap:20px;flex-wrap:wrap">
              <div><div class="room-lbl">🔓 ROOM ID</div><div class="room-id-val">${m.roomId||'—'}</div></div>
              <div><div class="room-lbl">🔑 PASSWORD</div><div class="room-pw-val">${m.roomPass||'—'}</div></div>
            </div></div>`;
        }
      } else if(!m.result){
        roomSection=`<div style="padding:0 16px 12px"><button class="btn btn-green btn-sm" onclick="openDailyJoin('${m.id}')">⚡ JOIN MATCH</button></div>`;
      }
    }
  } else if(isMyMatch){
    if(m.roomReleased){
      const isInThisMatch=myTeam&&(m.team1Id===myTeam.id||m.team2Id===myTeam.id||(m.brTeamIds||[]).includes(myTeam.id));
      const isCaptain=myTeam&&myTeam.captainId===cu.id&&isInThisMatch;
      if(isCaptain&&isInThisMatch){
        roomSection=`<div class="room-unlocked" style="margin:0 16px 12px">
          <div style="display:flex;gap:20px;flex-wrap:wrap">
            <div><div class="room-lbl">🔓 ROOM ID</div><div class="room-id-val">${m.roomId||'—'}</div></div>
            <div><div class="room-lbl">🔑 PASSWORD</div><div class="room-pw-val">${m.roomPass||'—'}</div></div>
          </div></div>`;
      } else if(isInThisMatch){
        roomSection=`<div class="room-unlocked" style="margin:0 16px 12px">
          <div style="font-family:'Roboto Mono',monospace;font-size:10px;color:#00e676;">🔓 Room released — Notifications check karo</div>
        </div>`;
      }
    } else {
      roomSection=`<div class="room-locked" style="margin:0 16px 12px">
        <div style="font-family:var(--font-mono);font-size:10px;color:var(--red);">🔒 Room ID will be released by admin before match</div>
      </div>`;
    }
  }

  let resultSection='';
  if(m.result){
    if((isBR||isDaily) && m.brScores && m.brScores.length){
      resultSection=`<div style="padding:0 16px 14px">
        <div style="font-family:var(--font-mono);font-size:9px;color:var(--gold);letter-spacing:2px;margin-bottom:6px">// FINAL STANDINGS</div>
        <table class="br-score-table">
          <tr><th>#</th><th>Team</th><th>Kills</th><th>Place Pts</th><th>Total</th></tr>
          ${m.brScores.sort((a,b)=>b.total-a.total).map((s,i)=>`
          <tr class="${i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':''}">
            <td>#${i+1}</td><td>${s.teamName}</td><td>${s.kills}</td><td>${s.placePts}</td>
            <td style="color:var(--cyan);font-weight:700">${s.total}</td>
          </tr>`).join('')}
        </table>
      </div>`;
    } else {
      resultSection=`<div class="result-banner" style="margin:0 16px 12px">
        <span style="font-size:16px">🏆</span>
        <div class="result-banner-text">WINNER: ${m.result}</div>
      </div>`;

  // Daily match — show entry/prize info instead of VS teams
  const teamsRow = isDaily
    ? `<div style="padding:8px 16px 10px;display:flex;gap:16px;flex-wrap:wrap">
        ${m.entry?`<div><div class="room-lbl">💰 Entry</div><div style="font-size:13px;font-weight:600;color:var(--gold)">${m.entry}</div></div>`:''}
        ${m.prize?`<div><div class="room-lbl">🏆 Prize</div><div style="font-size:13px;font-weight:600;color:var(--gold)">${m.prize}</div></div>`:''}
        ${(m.brTeamIds||[]).length?`<div><div class="room-lbl">👥 Teams Joined</div><div style="font-size:13px;font-weight:600;color:var(--cyan)">${(m.brTeamIds||[]).length}</div></div>`:''}
      </div>`
    : `<div class="match-teams-row">
        <div class="match-team-box${m.result===t1?.name?' winner':''}">
          <div class="match-team-name">${t1?.name||m.team1||'TBD'}</div>
          <div class="match-team-tag">${t1?.tag||''}${isMultiTeam&&(m.brTeamIds||[]).length>2?` +${(m.brTeamIds||[]).length-2} more`:''}</div>
        </div>
        <div class="match-vs-badge">VS</div>
        <div class="match-team-box right${m.result===t2?.name?' winner':''}">
          <div class="match-team-name">${t2?.name||m.team2||'TBD'}</div>
          <div class="match-team-tag">${t2?.tag||''}</div>
        </div>
      </div>`;

  return `<div class="match-block" style="${isMyMatch&&role!=='admin'?'border-color:rgba(0,245,255,0.25);':''}${_mbg}" >
    <div class="match-block-accent" style="background:${accentColor}"></div>
    <div class="match-top">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span style="font-family:'Roboto Mono',monospace;font-size:11px;color:#7c4dff;letter-spacing:2px;text-transform:uppercase;font-weight:700">${m.round||'Round 1'}</span>
        <span style="color:#333">|</span>
        <span style="font-size:15px;font-weight:600;color:#fff">📅 ${m.date||'TBD'}</span>
        <span style="font-size:15px;font-weight:600;color:#ffc107">⏰ ${m.time||'TBD'}</span>
        ${isMyMatch&&role!=='admin'?`<span style="font-size:11px;font-weight:700;color:#00b4ff;background:rgba(0,180,255,0.1);border:1px solid rgba(0,180,255,0.3);padding:3px 10px;border-radius:3px;letter-spacing:1px">YOUR MATCH</span>`:''}
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <span class="match-type-badge ${typeBadgeClass}">${typeBadgeLabel}</span>
        ${m.matchFormat&&!isDaily?`<span style="font-family:var(--font-mono);font-size:8px;color:var(--muted);border:1px solid rgba(255,255,255,0.1);padding:2px 7px;border-radius:3px;letter-spacing:1px">${m.matchFormat}</span>`:''}
      </div>
    </div>
    ${teamsRow}
    ${roomSection}
    ${resultSection}
  </div>`;
}

    html+=`<div style="text-align:center;padding:20px;color:var(--muted);font-family:var(--font-mono);font-size:10px">// NO JOIN REQUESTS YET</div>`;

      const cap=DB.users.find(u=>u.id===r.captainId);

            ${r.utr?`<div style="font-family:var(--font-mono);font-size:9px;color:var(--green);margin-top:2px">💰 UTR: ${r.utr}</div>`:`<div style="font-family:var(--font-mono);font-size:9px;color:var(--muted)">No payment UTR</div>`}
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">
            <span class="badge ${r.status==='approved'?'b-open':r.status==='rejected'?'b-closed':'b-ongoing'}">${r.status.toUpperCase()}</span>
            ${r.status==='pending'?`<div style="display:flex;gap:5px">

            </div>`:''}
          </div>
        </div>
      </div>`;
    });
  }
  openMo(html);
}

function previewNmQR(e){
  const f=e.target.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    const data=ev.target.result;
    if(g('nm-qr-data'))g('nm-qr-data').value=data;
    if(g('nm-qr-preview-wrap'))g('nm-qr-preview-wrap').innerHTML=`<img src="${data}" style="width:130px;height:130px;object-fit:contain;border:1px solid rgba(255,215,0,0.3);cursor:pointer" onclick="g('nm-qr-file').click()" title="Click to change"/>`;
  };reader.readAsDataURL(f);
}

// ── Get registered teams for a container (tournament or season) ──
function getRegisteredTeams(containerId){
  if(!containerId) return DB.teams;

  // Check if it's a tournament
  const isTour = DB.tournaments.find(t => t.id === containerId);
  if(isTour){
    const regs = DB.registrations.filter(r => r.tournamentId === containerId);
    if(!regs.length) return null;
    return regs.map(r => DB.teams.find(t => t.id === r.teamId)).filter(Boolean);
  }

  // Check if it's a season — collect teams from all tournaments in this season
  // (seasons don't have direct registrations, so we look for all registrations
  //  where the tournament's seasonId matches, or fall back to all teams)
  const isSeason = DB.seasons.find(s => s.id === containerId);
  if(isSeason){
    // Find tournaments linked to this season (if any have a seasonId field)
    const linkedTours = DB.tournaments.filter(t => t.seasonId === containerId);
    if(linkedTours.length){
      const teamIds = new Set();
      linkedTours.forEach(lt => {
        DB.registrations.filter(r => r.tournamentId === lt.id).forEach(r => teamIds.add(r.teamId));
      });
      const teams = [...teamIds].map(id => DB.teams.find(t => t.id === id)).filter(Boolean);
      if(teams.length) return teams;
    }
    // Seasons have no linked registrations — return null (fallback to all)
    return null;
  }

  return null;
}

// ── Called when Tournament/Season dropdown changes ──
function onMatchContainerChange(){
  const containerId = v('nm-container');
  let teams = getRegisteredTeams(containerId);
  const warn = g('nm-container-warn');

  if(!containerId){
    // Nothing selected — clear team lists
    const emptyOpt = '<option value="">-- Select Tournament First --</option>';
    g('nm-t1').innerHTML = emptyOpt;
    g('nm-t2').innerHTML = emptyOpt;
    g('br-team-checkboxes').innerHTML = `<div style="font-family:var(--font-mono);font-size:10px;color:var(--muted);text-align:center;padding:12px">Select a Tournament / Season first</div>`;
    if(warn) warn.style.display='none';
    return;
  }

  let useFallback = false;
  if(!teams || teams.length === 0){
    teams = DB.teams; // fallback to all teams
    useFallback = true;
  }
  if(warn) warn.style.display = useFallback ? 'block' : 'none';

  // Update CS dropdowns
  const teamOpts = `<option value="">-- Select Team --</option>` +
    teams.map(t=>`<option value="${t.id}">${t.name} [${t.tag}]</option>`).join('');
  g('nm-t1').innerHTML = teamOpts;
  g('nm-t2').innerHTML = teamOpts;

  // Update BR checkboxes
  g('br-team-checkboxes').innerHTML = teams.length
    ? teams.map(t=>`<label style="display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.04)">
        <input type="checkbox" class="br-team-cb" value="${t.id}" style="accent-color:var(--cyan);width:14px;height:14px"/>
        <span style="font-family:var(--font-hd);font-size:12px">${t.name}</span>
        <span style="font-family:var(--font-mono);font-size:9px;color:var(--purple)">[${t.tag}]</span>
      </label>`).join('')
    : `<div style="font-family:var(--font-mono);font-size:10px;color:var(--muted);text-align:center;padding:12px">No teams found</div>`;
}

function brCheckAll(check){
  document.querySelectorAll('.br-team-cb').forEach(cb=>cb.checked=check);
}

let _matchType='BR';
let _matchFormat='SQUAD';

function pickMatchType(t){
  _matchType=t;
  if(g('nm-type')) g('nm-type').value=t;
  ['mt-daily','mt-tour'].forEach(id=>{const el=g(id);if(el)el.className='role-opt';});
  const sel=t==='DAILY'?'mt-daily':'mt-tour';
  if(g(sel)) g(sel).className='role-opt sel-ply';

  const tourFields=g('nm-tour-fields');
  const dailyFields=g('nm-daily-fields');
  if(t==='DAILY'){
    if(tourFields) tourFields.style.display='none';
    if(dailyFields) dailyFields.style.display='block';
  } else {
    if(tourFields) tourFields.style.display='block';
    if(dailyFields) dailyFields.style.display='none';
    // Trigger game mode layout based on current selection
    const currentGm=g('nm-gamemode')?.value||'BR';
    pickGameMode(currentGm);
  }
}

function pickGameMode(gm){
  if(g('nm-gamemode')) g('nm-gamemode').value=gm;
  ['gm-br','gm-cs'].forEach(id=>{const el=g(id);if(el)el.className='role-opt';});
  const sel=gm==='BR'?'gm-br':'gm-cs';
  if(g(sel)) g(sel).className='role-opt sel-ply';

  // Only change team layout if tournament is selected
  if(_matchType==='DAILY') return;

  const brWrap=g('br-extra-teams-wrap');
  const t1=g('nm-t1'),t2=g('nm-t2'),l1=g('nm-t1-label'),l2=g('nm-t2-label');

  if(gm==='BR'){
    // BR: multi-team checkboxes, hide 1v1 dropdowns
    if(brWrap) brWrap.style.display='block';
    [t1,t2,l1,l2].forEach(el=>{if(el)el.style.display='none';});
  } else {
    // CS: 1v1 dropdowns, hide checkboxes
    if(brWrap) brWrap.style.display='none';
    [t1,t2,l1,l2].forEach(el=>{if(el)el.style.display='block';});
  }
}

function pickMatchFormat(f){
  _matchFormat=f;
  if(g('nm-format')) g('nm-format').value=f;
  // Reset all format buttons
  ['fmt-squad','fmt-duo','fmt-solo'].forEach(id=>{
    const el=g(id);
    if(el) el.className='role-opt';
  });
  // Highlight selected (use sel-cap for format = blue tinge)
  const selMap={SQUAD:'fmt-squad',DUO:'fmt-duo',SOLO:'fmt-solo'};
  if(g(selMap[f])) g(selMap[f]).className='role-opt sel-cap';
}

function saveNewMatch(){
  const isDaily=_matchType==='DAILY';
  const gameMode=g('nm-gamemode')?.value||'BR';
  const isCS=gameMode==='CS';

  let t1Id,t2Id,brTeamIds=[];

  if(isDaily){
    t1Id=null; t2Id=null; brTeamIds=[];
  } else if(!isCS){
    // Tournament BR — checkboxes
    const checked=document.querySelectorAll('.br-team-cb:checked');
    brTeamIds=[...checked].map(c=>c.value);
    if(brTeamIds.length<2){set('nm-err','⚠ SELECT AT LEAST 2 TEAMS');return;}
    t1Id=brTeamIds[0];t2Id=brTeamIds[1];
  } else {
    // Tournament CS — dropdowns
    t1Id=v('nm-t1');t2Id=v('nm-t2');
    if(!t1Id||!t2Id){set('nm-err','⚠ SELECT BOTH TEAMS');return;}
    if(t1Id===t2Id){set('nm-err','⚠ TEAMS MUST BE DIFFERENT');return;}
    brTeamIds=[t1Id,t2Id];
  }

  const t1=DB.teams.find(x=>x.id===t1Id),t2=DB.teams.find(x=>x.id===t2Id);
  const maxTeams=parseInt(g('nm-maxteams')?.value||'12')||12;
  const entry=isDaily?(v('nm-entry')||''):'';
  const prize=isDaily?(v('nm-prize')||''):'';
  const qrImage=isDaily?(g('nm-qr-data')?.value||''):'';
  const label=isDaily?(v('nm-label')||''):'';

  const match={
    id:'m2_'+Date.now(),
    matchType:isDaily?'daily':'tournament',
    gameMode,
    matchFormat:_matchFormat,
    maxTeams,
    containerId:isDaily?null:(v('nm-container')||null),
    round:isDaily?(label||'Daily Match'):(v('nm-round')||'Round 1'),
    label,
    team1Id:t1Id,team2Id:t2Id,
    team1:t1?.name||'',team2:t2?.name||'',
    brTeamIds,
    entry,prize,qrImage,
    date:v('nm-date'),time:v('nm-time'),
    roomId:'',roomPass:'',
    roomReleased:false,result:'',brScores:[],
    bannedTeams:[],
    status:'open',
    createdAt:Date.now()
  };
  if(!DB._d.matches)DB._d.matches=[];
  DB.matches.push(match);DB.save();
  // Notify teams (only for tournament matches)
  if(!isDaily){
    brTeamIds.forEach(tid=>{
      const team=DB.teams.find(x=>x.id===tid);
      if(!team)return;
      const affectedMembers=[team.captainId,...(team.members||[])];
      affectedMembers.forEach(uid=>{
        DB.requests.push({id:'notif'+Date.now()+Math.random(),type:'match_scheduled',toUserId:uid,fromUserId:'admin1',matchId:match.id,status:'unread',at:Date.now(),
          title:'📅 Match Scheduled!',body:`Your team "${team.name}" — ${match.round} · ${match.date||'TBD'} ${match.time||''} [${_matchFormat}]`});
      });
    });
  }
  DB.save();closeMo();showToast('✓ MATCH CREATED',false,'ok');
  updateNotifBadge();buildSidebar();pMatches(g('mc'));
}

// ── TOGGLE ROOM RELEASE ──
function toggleRoom(matchId, release){
  const m=DB.matches.find(x=>x.id===matchId);
  if(!m)return;
  m.roomReleased=release;
  if(release){
    // Notify ONLY captain of each team (room ID is sensitive)
    [m.team1Id,m.team2Id].filter(Boolean).forEach(tid=>{
      const team=DB.teams.find(x=>x.id===tid);
      if(!team)return;
      // Send to captain + all members of THIS team only
      const affected=[team.captainId,...(team.members||[])];
      affected.forEach(uid=>{
        DB.requests.push({id:'notif'+Date.now()+Math.random(),type:'room_released',toUserId:uid,fromUserId:'admin1',matchId:m.id,status:'unread',at:Date.now(),
          title:'🔓 Room Released!',body:`${m.round} — Room ID: ${m.roomId} · Password: ${m.roomPass}`});
      });
    });
    showToast('✓ ROOM RELEASED — TEAMS NOTIFIED',false,'ok');
  } else {
    showToast('🔒 ROOM LOCKED',false,'');
  }
  DB.save();updateNotifBadge();buildSidebar();pMatches(g('mc'));
}

function openSetResult(matchId){
  const m=DB.matches.find(x=>x.id===matchId);

  const t2=DB.teams.find(x=>x.id===m.team2Id);
  const isDaily=m.matchType==='DAILY'||m.matchType==='daily';

  if(isDaily||isBRmode){
    // Get teams based on match type
    let brTeams=[];
    if(isDaily){
      // Daily: approved join requests
      const approvedReqs=DB.requests.filter(r=>r.type==='daily_join'&&r.matchId===m.id&&r.status==='approved');
      brTeams=approvedReqs.map(r=>DB.teams.find(t=>t.id===r.teamId)).filter(Boolean);

    } else {
      brTeams=(m.brTeamIds||[]).map(id=>DB.teams.find(t=>t.id===id)).filter(Boolean);
      if(!brTeams.length) brTeams=[t1,t2].filter(Boolean);
    }

    openMo(`<button class="mo-close" onclick="closeMo()">✕</button>
      <div class="mo-title">🎯 SET BR SCORES</div>
      <div style="font-family:var(--font-mono);font-size:9px;color:var(--muted);letter-spacing:2px;margin-bottom:14px">KILL PTS × 2 + PLACEMENT PTS</div>
      ${brTeams.map((t,i)=>t?`
      <div style="background:rgba(0,245,255,0.03);border:1px solid rgba(0,245,255,0.08);padding:10px 13px;margin-bottom:8px">
        <div style="font-family:var(--font-hd);font-size:12px;letter-spacing:2px;margin-bottom:8px">${t.name}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
          <div><label class="fl" style="font-size:8px">Kills</label><input class="fi" id="br-kills-${t.id}" type="number" value="0" min="0" style="padding:7px 10px;font-size:13px;margin-bottom:0" oninput="calcBRTotal('${t.id}')"/></div>
          <div><label class="fl" style="font-size:8px">Place Pts</label><input class="fi" id="br-place-${t.id}" type="number" value="0" min="0" style="padding:7px 10px;font-size:13px;margin-bottom:0" oninput="calcBRTotal('${t.id}')"/></div>
          <div><label class="fl" style="font-size:8px">Total</label><div id="br-total-${t.id}" style="background:rgba(0,245,255,0.05);border:1px solid rgba(0,245,255,0.15);padding:7px 10px;font-family:var(--font-hd);font-size:15px;color:var(--cyan)">0</div></div>

  } else {
    // CS: simple winner pick
    openMo(`<button class="mo-close" onclick="closeMo()">✕</button>
      <div class="mo-title">⚔ SET CS RESULT</div>
      <div style="font-family:var(--font-mono);font-size:9px;color:var(--muted);letter-spacing:2px;margin-bottom:14px">WINNER SELECT KARO</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
        <div id="cs-opt-1" style="background:rgba(0,245,255,0.05);border:2px solid rgba(0,245,255,0.15);padding:16px;text-align:center;cursor:pointer;border-radius:6px;transition:all .2s" onclick="csPickWinner('${t1?.name||''}','cs-opt-1','cs-opt-2')">

          <div style="font-family:var(--font-hd);font-size:14px;letter-spacing:2px;color:#fff">${t1?.name||'Team 1'}</div>
          <div style="font-family:var(--font-mono);font-size:9px;color:var(--muted);margin-top:3px">${t1?.tag||''}</div>
        </div>
        <div id="cs-opt-2" style="background:rgba(191,95,255,0.05);border:2px solid rgba(191,95,255,0.15);padding:16px;text-align:center;cursor:pointer;border-radius:6px;transition:all .2s" onclick="csPickWinner('${t2?.name||''}','cs-opt-2','cs-opt-1')">
          <div style="font-size:22px;margin-bottom:6px">🏆</div>
          <div style="font-family:var(--font-hd);font-size:14px;letter-spacing:2px;color:#fff">${t2?.name||'Team 2'}</div>
          <div style="font-family:var(--font-mono);font-size:9px;color:var(--muted);margin-top:3px">${t2?.tag||''}</div>
        </div>
      </div>
      <input class="fi" id="cs-win-val" placeholder="Ya custom result type karo (e.g. 16-12)" style="margin-bottom:12px"/>
      <button class="btn btn-gold btn-full" onclick="saveCSResult('${matchId}')">⚡ CONFIRM RESULT</button>`);

function csPickWinner(name, selId, otherId){
  if(g('cs-win-val')) g('cs-win-val').value=name;
  if(g(selId)) g(selId).style.borderColor='rgba(10,255,160,0.7)';
  if(g(otherId)) g(otherId).style.borderColor='rgba(255,255,255,0.1)';
}

function calcBRTotal(teamId){
  const kills=parseInt(g('br-kills-'+teamId)?.value)||0;
  const place=parseInt(g('br-place-'+teamId)?.value)||0;
  const total=(kills*2)+place;
  const el=g('br-total-'+teamId);if(el)el.textContent=total;
}

function saveBRResult(matchId){
  const m=DB.matches.find(x=>x.id===matchId);if(!m)return;
  const ids=(v('br-team-ids')||'').split(',').filter(Boolean);
  const scores=ids.map(tid=>{
    const team=DB.teams.find(x=>x.id===tid);
    const kills=parseInt(g('br-kills-'+tid)?.value)||0;
    const place=parseInt(g('br-place-'+tid)?.value)||0;
    return{teamId:tid,teamName:team?.name||tid,kills,placePts:place,total:(kills*2)+place};
  }).sort((a,b)=>b.total-a.total);
  m.brScores=scores;
  m.result=scores[0]?.teamName||'TBD';
  // Notify teams
  notifyMatchResult(m);
  var _isD=(m.matchType==='daily'||m.matchType==='DAILY');DB.save();closeMo();showToast('✓ BR SCORES SAVED',false,'ok');pSchedule(g('mc'));if(!_isD&&cu.role!=='admin')setTimeout(function(){switchMatchTab('tournament');},50);
}

function saveCSResult(matchId){
  const m=DB.matches.find(x=>x.id===matchId);if(!m)return;
  const winner=v('cs-win-val');if(!winner){showToast('⚠ SELECT OR TYPE WINNER',true);return;}
  m.result=winner.toUpperCase();
  notifyMatchResult(m);
  var _isD2=(m.matchType==='daily'||m.matchType==='DAILY');DB.save();closeMo();showToast('✓ RESULT SAVED',false,'ok');pSchedule(g('mc'));if(!_isD2&&cu.role!=='admin')setTimeout(function(){switchMatchTab('tournament');},50);
}

function notifyMatchResult(m){
  // Only notify teams that played in this match
  [m.team1Id,m.team2Id].filter(Boolean).forEach(tid=>{
    const team=DB.teams.find(x=>x.id===tid);
    if(!team)return;

  });

function doResetPassword(userId){
  const pw=v('rp-new');

  const u=DB.users.find(x=>x.id===userId);
  if(!u)return;
  u.password=pw;

  closeMo();
  showToast('✓ PASSWORD RESET FOR '+u.name,false,'ok');
}

// ══ RAZORPAY CONFIG ══
const RZP_KEY = ZONEX_CONFIG.RAZORPAY_KEY;

function parseAmount(entryStr){
  // Extract numeric amount from strings like "₹50", "Rs 100", "50", "₹10 per squad"
  if(!entryStr) return 0;
  const match = entryStr.replace(/,/g,'').match(/\d+(\.\d+)?/);
  return match ? Math.round(parseFloat(match[0])) : 0;
}

function openRazorpay(options){
  return new Promise((resolve, reject) => {
    if(typeof Razorpay === 'undefined'){
      showToast('⚠ PAYMENT LOAD NAHI HUA, RETRY KARO',true);
      reject('Razorpay not loaded');
      return;
    }
    const rzp = new Razorpay({
      key: RZP_KEY,
      currency: ZONEX_CONFIG.CURRENCY,
      name: ZONEX_CONFIG.SITE_NAME,
      description: options.description || 'Entry Fee',
      image: '',
      amount: options.amount * 100, // paise
      prefill: {
        name: cu?.name || '',
        contact: cu?.phone || ''
      },
      theme: { color: '#00b4ff' },
      handler: function(response){
        resolve(response.razorpay_payment_id);
      },
      modal: {
        ondismiss: function(){ reject('dismissed'); }
      }
    });
    rzp.open();
  });
}

    ${tournaments.length?`<div class="xcard" style="margin-bottom:16px">
      <div class="xcard-t">🏆 Per-Tournament Images</div>
      ${tournaments.map(t=>renderSlotRow(null, t.name, 'tour_'+t.id)).join('')}
    </div>`:''}

    ${matches.length?`<div class="xcard" style="margin-bottom:16px">
      <div class="xcard-t">⚔️ Per-Match Images</div>
      ${matches.map(m=>renderSlotRow(null,(m.team1||'Team1')+' vs '+(m.team2||'Team2'),'match_'+m.id)).join('')}
    </div>`:''}

    ${dailyMatches.length?`<div class="xcard" style="margin-bottom:16px">
      <div class="xcard-t">⚡ Per-Daily Match Images</div>
      ${dailyMatches.map(dm=>renderSlotRow(null,dm.title||'Daily Match','dm_'+dm.id)).join('')}
    </div>`:''}

  </div>`;
}

function saveImgUrl(slotId, key){
  const inputId = 'img-url-'+(slotId||key);
  const url = (document.getElementById(inputId)?.value||'').trim();
  if(!url){showToast('⚠ PASTE AN IMAGE URL FIRST',true);return;}
  if(!DB._d.images) DB._d.images={};
  if(!DB._d.customImages) DB._d.customImages={};
  if(slotId) DB._d.images[slotId]=url;
  else if(key) DB._d.customImages[key]=url;
  DB.save();
  showToast('✓ IMAGE SAVED',false,'ok');
  pImageManager(g('mc'));
}

function removeImgUrl(slotId, key){
  if(slotId && DB._d.images) delete DB._d.images[slotId];
  if(key && DB._d.customImages) delete DB._d.customImages[key];
  DB.save();
  showToast('IMAGE REMOVED');
  pImageManager(g('mc'));
}

function clearAllImages(){
  if(!confirm('Clear ALL images?'))return;
  DB._d.images={};DB._d.customImages={};
  DB.save();showToast('ALL IMAGES CLEARED');pImageManager(g('mc'));
}

// ══ MODAL ══
function openMo(html){g('mo-body').innerHTML=html;g('mo-wrap').classList.add('open');}
function closeMo(){g('mo-wrap').classList.remove('open');}
g('mo-wrap').addEventListener('click',e=>{if(e.target===e.currentTarget)closeMo();});

// ══ TOAST ══
function showToast(msg,isErr=false,type=''){
  const t=g('toast');t.textContent=msg;
  t.className='toast show'+(isErr?' t-err':type==='ok'?' t-ok':'');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2800);
}

// ══ HELPERS ══
function g(id){return document.getElementById(id);}
function v(id){return(g(id)?.value||'').trim();}
function set(id,val){const el=g(id);if(el)el.textContent=val;}
</script>
