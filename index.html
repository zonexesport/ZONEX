<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ZoneX Esports</title>
<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:#000000;--bg1:#080808;--bg2:#0e0e0e;--bg3:#121212;--card:#0a0a0a;
  --blue:#1a6fff;--blue2:#2979ff;--blue3:#0d47a1;
  --cyan:#00b4ff;--cyan2:#0090cc;
  --purple:#7c4dff;--purple2:#651fff;
  --gold:#ffc107;--gold2:#ff9800;--orange:#ff6d00;
  --red:#f44336;--green:#00e676;
  --white:#ffffff;--off-white:#e0e0e0;--muted:#607d8b;--muted2:#1a2332;
  --font-hd:'Inter',sans-serif;--font-body:'Inter',sans-serif;--font-mono:'Roboto Mono',monospace;
  --border:rgba(26,111,255,0.25);--border2:rgba(255,255,255,0.08);
}
*{box-sizing:border-box !important;margin:0;padding:0;max-width:100%;}
body{background:#000;color:#fff;font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:var(--bg1);}::-webkit-scrollbar-thumb{background:var(--cyan2);border-radius:2px;}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background-image:linear-gradient(rgba(26,111,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(26,111,255,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
body::after{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(0,245,255,0.04) 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(191,95,255,0.04) 0%,transparent 45%);pointer-events:none;z-index:0;}

/* LOADING */
#loading{
  position:fixed;inset:0;background:#000;
  display:flex;align-items:center;justify-content:center;
  z-index:9999;flex-direction:column;gap:0;
  min-height:100vh;min-height:100dvh;
}
.ld-hex{width:110px;height:110px;margin:0 auto 18px;animation:hexSpin 3s linear infinite;}
.ld-hex svg{width:100%;height:100%;}
.ld-logo{font-family:'Inter',sans-serif;font-size:48px;font-weight:900;letter-spacing:6px;color:#fff;}
.ld-sub{font-family:var(--font-mono);font-size:10px;color:var(--muted);letter-spacing:6px;margin-top:4px;}
.ld-bar-wrap{width:260px;height:2px;background:var(--muted2);margin:22px auto 0;overflow:hidden;position:relative;}
.ld-bar{height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple));animation:ldFill 2s cubic-bezier(.4,0,.2,1) forwards;}
.ld-scan{position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(0,245,255,0.7),transparent);animation:ldScan 2s ease forwards;}
.ld-pct{font-family:var(--font-mono);font-size:12px;color:var(--cyan);margin-top:8px;letter-spacing:2px;}
@keyframes hexSpin{to{transform:rotate(360deg)}}
@keyframes gradShift{0%,100%{background-position:0%}50%{background-position:100%}}
@keyframes ldFill{from{width:0}to{width:100%}}
@keyframes ldScan{from{left:-100%}to{left:100%}}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,245,255,0.4)}50%{box-shadow:0 0 0 6px rgba(0,245,255,0)}}
@keyframes notifPop{from{transform:scale(0.7);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes topGlow{0%,100%{opacity:.5}50%{opacity:1}}

/* PARTICLES */
.particle{position:fixed;border-radius:50%;pointer-events:none;z-index:0;animation:floatUp linear infinite;left:0;}
@keyframes floatUp{0%{transform:translateY(100vh);opacity:0}10%{opacity:.5}90%{opacity:.5}100%{transform:translateY(-80px);opacity:0}}

/* AUTH */
#auth-page{
  display:none;
  width:100vw;
  min-height:100vh;
  flex-direction:column;
  align-items:stretch;
  justify-content:flex-start;
  padding:0;
  position:relative;
  z-index:1;
  background:#000;
  overflow:hidden;
}
.auth-wrap{
  width:100%;
  max-width:100%;
  padding:16px;
  box-sizing:border-box;
  position:relative;
  z-index:1;
}
.hex-card{
  position:relative;
  background:#0a0a0a;
  border:1px solid rgba(26,111,255,0.3);
  border-radius:12px;
  overflow:hidden;
  width:100%;
  max-width:100%;
  box-sizing:border-box;
}
.hex-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),var(--purple),transparent);animation:topGlow 3s ease infinite;}
.auth-head{text-align:center;padding:20px 12px 8px;background:linear-gradient(180deg,rgba(0,245,255,0.04),transparent);}
.auth-logo{font-family:'Inter',sans-serif;font-size:42px;font-weight:900;letter-spacing:4px;color:#fff;}
.auth-esports{font-family:var(--font-mono);font-size:11px;letter-spacing:8px;color:var(--muted);margin-top:3px;}
.auth-tag{font-size:12px;color:rgba(0,245,255,0.5);letter-spacing:3px;margin-top:8px;}
.tab-row{display:flex;margin:12px 0 0;border:1px solid rgba(26,111,255,0.2);overflow:hidden;border-radius:6px;width:100%;box-sizing:border-box;}
.tab{flex:1;padding:11px;text-align:center;font-family:var(--font-hd);font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;cursor:pointer;border:none;background:transparent;color:var(--muted);transition:all .3s;position:relative;}
.tab.active{background:rgba(26,111,255,0.2);color:#2979ff;}
.tab.active::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:#2979ff;}
.auth-form{padding:14px 12px 20px;box-sizing:border-box;width:100%;}
.fl{display:block;font-family:'Roboto Mono',monospace;font-size:10px;color:#607d8b;letter-spacing:2px;text-transform:uppercase;margin-bottom:5px;}
.fi{width:100% !important;max-width:100% !important;background:#111;border:1px solid rgba(26,111,255,0.2);padding:11px 14px;color:#fff;font-family:'Inter',sans-serif;font-size:14px;font-weight:400;outline:none;transition:border .2s;margin-bottom:13px;border-radius:4px;box-sizing:border-box;}
.fi:focus{border-color:#2979ff;background:#151515;}
.fi::placeholder{color:var(--muted);}
select.fi option{background:var(--bg2);}
textarea.fi{resize:vertical;}
.role-pick{display:flex;gap:10px;margin-bottom:13px;}
.role-opt{flex:1;padding:12px 8px;text-align:center;cursor:pointer;border:1px solid rgba(255,255,255,0.07);background:rgba(255,255,255,0.02);transition:all .3s;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);}
.role-opt.sel-cap{background:rgba(191,95,255,0.15);border-color:rgba(191,95,255,0.5);}
.role-opt.sel-ply{background:rgba(0,245,255,0.1);border-color:rgba(0,245,255,0.4);}
.role-opt-icon{font-size:20px;display:block;margin-bottom:3px;}
.role-opt-lbl{font-family:var(--font-hd);font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.sel-cap .role-opt-lbl{color:var(--purple);}.sel-ply .role-opt-lbl{color:var(--cyan);}
.err-msg{color:var(--red);font-family:var(--font-mono);font-size:11px;margin-bottom:10px;text-align:center;min-height:15px;letter-spacing:1px;}

/* BUTTONS */
.btn{padding:10px 18px;border:none;font-family:'Inter',sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:all .2s;border-radius:4px;position:relative;overflow:hidden;}
.btn::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.08),transparent);opacity:0;transition:opacity .3s;}
.btn:hover::after{opacity:1;}
.btn:active{transform:scale(0.97);}
.btn-full{width:100%;}
.btn-cyan{background:rgba(0,180,255,0.1);color:#00b4ff;border:1px solid rgba(0,180,255,0.35);}
.btn-cyan:hover{background:rgba(0,180,255,0.2);}
.btn-purple{background:rgba(124,77,255,0.12);color:#7c4dff;border:1px solid rgba(124,77,255,0.35);}
.btn-purple:hover{background:rgba(124,77,255,0.22);}
.btn-gold{background:rgba(255,193,7,0.1);color:#ffc107;border:1px solid rgba(255,193,7,0.35);}
.btn-gold:hover{background:rgba(255,193,7,0.2);}
.btn-red{background:rgba(244,67,54,0.1);color:#f44336;border:1px solid rgba(244,67,54,0.3);}
.btn-green{background:rgba(0,230,118,0.1);color:#00e676;border:1px solid rgba(0,230,118,0.3);}
.btn-ghost{background:rgba(255,255,255,0.04);color:#607d8b;border:1px solid rgba(255,255,255,0.1);}
.btn-purple{background:rgba(124,77,255,0.12);color:#b388ff;border:1px solid rgba(124,77,255,0.4);}
.btn-purple:hover{background:rgba(124,77,255,0.22);}
.btn-ghost:hover{color:#fff;border-color:rgba(255,255,255,0.25);}
.btn-orange{background:linear-gradient(135deg,rgba(255,107,43,0.18),rgba(200,80,0,0.12));color:var(--orange);border:1px solid rgba(255,107,43,0.35);}
.btn-sm{padding:7px 13px;font-size:9px;letter-spacing:2px;}
.btn-xs{padding:5px 10px;font-size:8px;letter-spacing:1px;}

/* NAVBAR */
#app{
  display:none;min-height:100vh;min-height:100dvh;
  flex-direction:column;position:relative;z-index:1;
}
.navbar{background:#000;border-bottom:1px solid rgba(26,111,255,0.3);padding:0 20px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.navbar::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#2979ff,transparent);}
.nav-brand{display:flex;align-items:center;gap:10px;}
.nav-hexlogo{width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(0,245,255,0.15),rgba(191,95,255,0.15));border:1px solid rgba(0,245,255,0.3);font-family:var(--font-hd);font-size:14px;font-weight:900;color:var(--cyan);clip-path:polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);}
.nav-logo{font-family:'Inter',sans-serif;font-size:18px;font-weight:800;letter-spacing:2px;color:#fff;}
.nav-sub{font-family:var(--font-mono);font-size:8px;letter-spacing:4px;color:var(--muted);}
.nav-right{display:flex;align-items:center;gap:10px;}
.nav-role{font-family:var(--font-hd);font-size:8px;letter-spacing:2px;padding:3px 9px;text-transform:uppercase;font-weight:700;}
.r-admin{background:rgba(255,45,85,0.1);color:var(--red);border:1px solid rgba(255,45,85,0.3);}
.r-captain{background:rgba(191,95,255,0.1);color:var(--purple);border:1px solid rgba(191,95,255,0.3);}
.r-player{background:rgba(0,245,255,0.08);color:var(--cyan);border:1px solid rgba(0,245,255,0.22);}
.nav-name{font-family:var(--font-mono);font-size:11px;color:var(--muted);}

/* NOTIFICATION BELL */
.notif-bell{position:relative;cursor:pointer;background:none;border:none;color:var(--muted);font-size:18px;padding:4px;transition:color .2s;}
.notif-bell:hover{color:var(--white);}
.notif-dot{position:absolute;top:0;right:0;width:8px;height:8px;background:var(--red);border-radius:50%;border:1px solid var(--bg);animation:pulse 2s infinite;display:none;}
.notif-dot.show{display:block;}
.notif-count{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-family:var(--font-hd);font-size:8px;font-weight:700;width:16px;height:16px;border-radius:50%;display:none;align-items:center;justify-content:center;border:1px solid var(--bg);animation:notifPop .3s ease;}
.notif-count.show{display:flex;}

/* LAYOUT */
.layout{display:flex;flex:1;}
.sidebar{width:210px;background:#080808;border-right:1px solid rgba(26,111,255,0.15);padding:12px 8px;flex-shrink:0;position:relative;}
.sidebar::after{content:'';position:absolute;top:0;right:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent,var(--cyan),var(--purple),transparent);opacity:.4;}
.sb-sec{font-family:var(--font-mono);font-size:8px;color:var(--muted);letter-spacing:4px;padding:12px 10px 5px;text-transform:uppercase;}
.sb-item{display:flex;align-items:center;gap:9px;padding:9px 10px;color:#607d8b;font-size:13px;font-weight:500;cursor:pointer;margin-bottom:2px;transition:all .15s;border:none;background:none;width:100%;text-align:left;font-family:'Inter',sans-serif;border-left:2px solid transparent;border-radius:0 4px 4px 0;}
.sb-item svg{width:15px;height:15px;flex-shrink:0;}
.sb-item:hover{color:#fff;background:rgba(26,111,255,0.08);border-left-color:rgba(26,111,255,0.4);}
.sb-item.active{color:#2979ff;background:rgba(26,111,255,0.12);border-left-color:#2979ff;}
.sb-notif{margin-left:auto;background:var(--red);color:#fff;font-family:var(--font-hd);font-size:8px;font-weight:700;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center;}
.content{flex:1;padding:24px;overflow-y:auto;}

/* SECTION HEADER */
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
.sec-title{font-family:var(--font-hd);font-size:20px;font-weight:800;letter-spacing:3px;text-transform:uppercase;display:flex;align-items:center;gap:10px;}
.sec-bar{width:3px;height:20px;background:#2979ff;flex-shrink:0;}

/* STAT CARDS */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px;}
.sc{background:#111;border:1px solid rgba(26,111,255,0.2);padding:16px;position:relative;overflow:hidden;transition:all .3s;border-radius:6px;}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:var(--sc-grad);}
.sc:hover{transform:translateY(-2px);border-color:rgba(26,111,255,0.4);}
.sc-val{font-family:var(--font-hd);font-size:34px;font-weight:900;line-height:1;background:var(--sc-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.sc-lbl{font-family:var(--font-mono);font-size:8px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-top:3px;}
.sc-icon{position:absolute;right:12px;top:12px;font-size:24px;opacity:.12;}

/* CARDS */
.xcard{background:#111;border:1px solid rgba(26,111,255,0.2);padding:18px;margin-bottom:14px;position:relative;overflow:hidden;border-radius:4px;}
.xcard::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--blue2);}
.xcard-t{font-family:'Inter',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:12px;color:#fff;}

/* TOURNAMENT CARDS */
.tcard{background:#111;border:1px solid rgba(26,111,255,0.18);margin-bottom:10px;position:relative;overflow:hidden;transition:all .3s;border-radius:6px;}
.tcard:hover{border-color:rgba(41,121,255,0.45);}
.tcard-accent{position:absolute;left:0;top:0;bottom:0;width:3px;}
.tcard-top{background:linear-gradient(135deg,rgba(0,245,255,0.04),rgba(191,95,255,0.04));padding:13px 17px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;border-bottom:1px solid rgba(0,245,255,0.05);}
.tcard-body{padding:10px 17px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.tcard-name{font-family:var(--font-hd);font-size:16px;font-weight:800;letter-spacing:2px;text-transform:uppercase;}
.tcard-meta{font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-top:3px;line-height:1.6;}
.tcard-prize{font-family:var(--font-hd);font-size:18px;font-weight:900;color:var(--gold);text-shadow:0 0 12px rgba(255,215,0,.35);}

/* BADGES */
.badge{font-family:var(--font-hd);font-size:8px;padding:3px 9px;letter-spacing:2px;text-transform:uppercase;font-weight:700;flex-shrink:0;}
.b-open{background:rgba(10,255,160,0.08);color:var(--green);border:1px solid rgba(10,255,160,0.25);}
.b-ongoing{background:rgba(255,215,0,0.08);color:var(--gold);border:1px solid rgba(255,215,0,0.25);}
.b-closed{background:rgba(74,96,128,0.08);color:var(--muted);border:1px solid rgba(74,96,128,0.18);}

/* PLAYER ROWS */
.prow{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;background:#111;border:1px solid rgba(26,111,255,0.12);margin-bottom:5px;transition:all .2s;border-radius:4px;}
.prow:hover{background:#161616;border-color:rgba(26,111,255,0.3);}
.prow-l{display:flex;align-items:center;gap:10px;}
.av{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-family:var(--font-hd);font-weight:900;font-size:13px;flex-shrink:0;}
.av-c{background:linear-gradient(135deg,rgba(0,245,255,0.18),rgba(0,200,215,0.12));color:var(--cyan);border:1px solid rgba(0,245,255,0.28);}
.av-p{background:linear-gradient(135deg,rgba(191,95,255,0.18),rgba(155,63,232,0.12));color:var(--purple);border:1px solid rgba(191,95,255,0.28);}
.av-g{background:linear-gradient(135deg,rgba(255,215,0,0.18),rgba(255,170,0,0.12));color:var(--gold);border:1px solid rgba(255,215,0,0.28);}
.prow-name{font-size:14px;font-weight:600;}
.prow-uid{font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-top:1px;}
.prow-acts{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;}

/* REQUEST CARDS */
.req-card{background:#111;border:1px solid rgba(255,193,7,0.25);padding:13px 15px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;animation:pageIn .3s ease;border-radius:4px;}
.req-from{font-family:var(--font-hd);font-size:13px;letter-spacing:1px;color:var(--gold);}
.req-meta{font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-top:2px;}

/* SEASON CARDS */
.season-card{background:var(--card);border:1px solid rgba(191,95,255,0.2);margin-bottom:10px;overflow:hidden;position:relative;transition:all .3s;cursor:pointer;}
.season-card:hover{border-color:rgba(191,95,255,0.4);transform:translateX(2px);}
.season-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--purple),var(--cyan));}
.season-header{background:linear-gradient(135deg,rgba(191,95,255,0.08),rgba(0,245,255,0.04));padding:12px 17px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(191,95,255,0.1);}
.season-name{font-family:var(--font-hd);font-size:16px;font-weight:800;letter-spacing:2px;text-transform:uppercase;}
.season-body{padding:10px 17px 13px;}
.season-meta{font-family:var(--font-mono);font-size:10px;color:var(--muted);line-height:1.8;}

/* MODAL */
.mo-wrap{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:500;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
.mo-wrap.open{display:flex;}
.mo{background:#0e0e0e;border:1px solid rgba(26,111,255,0.3);padding:24px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;position:relative;animation:pageIn .3s ease;border-radius:8px;}
.mo::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--blue2);border-radius:8px 8px 0 0;}
.mo-title{font-family:var(--font-hd);font-size:17px;font-weight:800;letter-spacing:3px;text-transform:uppercase;margin-bottom:16px;}
.mo-close{float:right;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;margin-top:-3px;transition:color .2s;line-height:1;}
.mo-close:hover{color:var(--red);}

/* PROFILE */
.profile-hero{background:#111;border:1px solid rgba(26,111,255,0.25);padding:22px;margin-bottom:16px;display:flex;align-items:center;gap:18px;position:relative;overflow:hidden;border-radius:6px;}
.profile-hero::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);}
.profile-av{width:72px;height:72px;display:flex;align-items:center;justify-content:center;font-family:var(--font-hd);font-weight:900;font-size:28px;background:linear-gradient(135deg,rgba(0,245,255,0.2),rgba(191,95,255,0.15));border:2px solid rgba(0,245,255,0.35);flex-shrink:0;clip-path:polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);}
.profile-name{font-family:var(--font-hd);font-size:22px;font-weight:900;letter-spacing:3px;text-transform:uppercase;}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.04);}
.info-row:last-child{border-bottom:none;}
.info-lbl{font-family:var(--font-mono);font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}

/* QR */
.qr-area{background:rgba(255,215,0,0.03);border:1px solid rgba(255,215,0,0.18);padding:18px;text-align:center;margin-bottom:14px;}
.qr-img-wrap{width:160px;height:160px;margin:0 auto 10px;position:relative;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.03);border:2px dashed rgba(255,215,0,0.25);}
.qr-img-wrap img{max-width:100%;max-height:100%;object-fit:contain;}
.qr-placeholder-text{font-family:var(--font-mono);font-size:10px;color:var(--muted);letter-spacing:2px;text-align:center;}
.utr-area{background:rgba(10,255,160,0.03);border:1px solid rgba(10,255,160,0.18);padding:14px;margin-top:10px;}
.utr-lbl{font-family:var(--font-mono);font-size:9px;color:var(--green);letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;}

/* TOAST */
.toast{position:fixed;bottom:22px;right:22px;background:var(--bg2);border:1px solid rgba(0,245,255,0.3);padding:11px 18px;z-index:999;opacity:0;transition:all .3s;pointer-events:none;font-family:var(--font-hd);font-size:11px;letter-spacing:2px;color:var(--cyan);clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px);}
.toast.show{opacity:1;transform:translateY(-4px);}
.toast.t-err{border-color:rgba(255,45,85,0.4);color:var(--red);}
.toast.t-ok{border-color:rgba(10,255,160,0.35);color:var(--green);}

/* MATCH */
.match-card{background:var(--card);border:1px solid rgba(191,95,255,0.14);margin-bottom:8px;overflow:hidden;transition:border-color .3s;}
.match-card:hover{border-color:rgba(191,95,255,0.28);}
.match-hd{background:linear-gradient(90deg,rgba(191,95,255,0.08),rgba(0,245,255,0.04));padding:7px 15px;display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:9px;color:var(--purple);letter-spacing:2px;border-bottom:1px solid rgba(191,95,255,0.08);}
.match-body{padding:14px 15px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;}
.match-team{font-family:'Inter',sans-serif;font-size:18px;font-weight:800;letter-spacing:1px;text-transform:uppercase;}
.match-vs{font-family:var(--font-hd);font-size:22px;font-weight:900;background:linear-gradient(135deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;}
.match-result{background:rgba(255,215,0,0.07);border:1px solid rgba(255,215,0,0.18);padding:5px 14px;margin:0 15px 10px;font-family:var(--font-hd);font-size:11px;color:var(--gold);letter-spacing:2px;text-align:center;}

/* TEAM HERO */
.team-hero{background:#111;border:1px solid rgba(26,111,255,0.2);padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;border-radius:6px;}
.team-badge{width:46px;height:46px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(191,95,255,0.2),rgba(155,63,232,0.12));border:1px solid rgba(191,95,255,0.35);font-family:var(--font-hd);font-size:17px;font-weight:900;color:var(--purple);clip-path:polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);}
.team-name-big{font-family:var(--font-hd);font-size:18px;font-weight:900;letter-spacing:3px;text-transform:uppercase;}
.team-tag-sm{font-family:var(--font-mono);font-size:9px;color:var(--purple);background:rgba(191,95,255,0.1);border:1px solid rgba(191,95,255,0.22);padding:2px 7px;letter-spacing:2px;display:inline-block;margin-top:3px;}
.xbtn{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;cursor:pointer;transition:all .3s;font-family:var(--font-hd);font-size:8px;letter-spacing:2px;text-transform:uppercase;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);color:var(--muted);}
.xbtn:hover{border-color:rgba(0,245,255,0.3);color:var(--cyan);}

/* CYBER DIVIDER */
hr.cyber{border:none;border-top:1px solid rgba(0,245,255,0.06);margin:14px 0;}



/* ══ UI IMPROVEMENTS ══ */
.page-tabs{display:flex;gap:0;margin-bottom:20px;border:1px solid rgba(26,111,255,0.2);border-radius:6px;overflow:hidden;flex-wrap:wrap;}
.page-tab{flex:1;padding:11px 16px;text-align:center;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;border:none;background:transparent;color:#607d8b;transition:all .2s;min-width:80px;font-family:'Inter',sans-serif;}
.page-tab.active{background:rgba(26,111,255,0.18);color:#2979ff;border-bottom:2px solid #2979ff;}
.page-tab:hover:not(.active){background:rgba(26,111,255,0.07);color:#aaa;}

/* Better info cards */
.info-card{background:#111;border:1px solid rgba(26,111,255,0.15);border-radius:6px;padding:16px;margin-bottom:10px;}
.info-card-title{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#607d8b;margin-bottom:10px;font-family:'Roboto Mono',monospace;}

/* Bigger date/time text */
.dt-big{font-size:16px!important;font-weight:600!important;color:#fff!important;letter-spacing:.5px;}
.dt-label{font-size:11px;color:#607d8b;font-family:'Roboto Mono',monospace;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px;}

/* Color coded status */
.status-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.sp-open{background:rgba(0,230,118,0.1);color:#00e676;border:1px solid rgba(0,230,118,0.3);}
.sp-closed{background:rgba(96,125,139,0.1);color:#607d8b;border:1px solid rgba(96,125,139,0.2);}
.sp-ongoing{background:rgba(255,193,7,0.1);color:#ffc107;border:1px solid rgba(255,193,7,0.3);}
.sp-pending{background:rgba(255,152,0,0.1);color:#ff9800;border:1px solid rgba(255,152,0,0.3);}

/* Section dividers */
.sec-divider{display:flex;align-items:center;gap:12px;margin:18px 0 12px;}
.sec-divider-line{flex:1;height:1px;background:rgba(26,111,255,0.12);}
.sec-divider-text{font-family:'Roboto Mono',monospace;font-size:10px;color:#607d8b;letter-spacing:2px;white-space:nowrap;}

/* Better empty states */
.empty-state{text-align:center;padding:40px 20px;}
.empty-state-icon{font-size:40px;margin-bottom:12px;}
.empty-state-text{font-size:14px;color:#607d8b;line-height:1.6;}

/* Highlight row on hover in tables */
.br-score-table tbody tr:hover td{background:rgba(26,111,255,0.06)!important;}

/* ══ MATCH MANAGER CSS ══ */
.round-tab{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;cursor:pointer;font-family:var(--font-hd);font-size:9px;letter-spacing:2px;text-transform:uppercase;border:1px solid rgba(0,245,255,0.12);background:rgba(0,245,255,0.02);color:var(--muted);transition:all .2s;margin-right:6px;margin-bottom:8px;}
.round-tab.active{background:rgba(0,245,255,0.12);color:var(--cyan);border-color:rgba(0,245,255,0.35);}
.round-tab:hover{border-color:rgba(0,245,255,0.25);color:var(--white);}

.match-block{background:#111;border:1px solid rgba(26,111,255,0.18);margin-bottom:10px;overflow:hidden;position:relative;transition:all .3s;border-radius:6px;}
.match-block:hover{border-color:rgba(41,121,255,0.4);}
.match-block-accent{position:absolute;left:0;top:0;bottom:0;width:3px;}

.match-top{background:rgba(26,111,255,0.07);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(26,111,255,0.1);}
.match-round-lbl{font-family:var(--font-mono);font-size:9px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;}
.match-type-badge{font-family:var(--font-hd);font-size:8px;padding:3px 8px;letter-spacing:2px;}
.mt-br{background:rgba(255,107,43,0.1);color:var(--orange);border:1px solid rgba(255,107,43,0.25);}
.mt-cs{background:rgba(0,245,255,0.08);color:var(--cyan);border:1px solid rgba(0,245,255,0.22);}
.mt-daily{background:rgba(0,230,118,0.08);color:var(--green);border:1px solid rgba(0,230,118,0.25);}

.match-teams-row{padding:14px 16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;}
.match-team-box{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);padding:10px 13px;}
.match-team-box.winner{background:rgba(10,255,160,0.06);border-color:rgba(10,255,160,0.25);}
.match-team-name{font-family:var(--font-hd);font-size:14px;font-weight:800;letter-spacing:2px;text-transform:uppercase;}
.match-team-tag{font-family:var(--font-mono);font-size:9px;color:var(--muted);margin-top:2px;}
.match-vs-badge{font-family:var(--font-hd);font-size:20px;font-weight:900;background:linear-gradient(135deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;letter-spacing:2px;}
.match-team-box.right{text-align:right;}

.match-info-row{padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,0.03);}
.match-info-chip{font-family:var(--font-mono);font-size:10px;color:var(--muted);display:flex;align-items:center;gap:5px;}

.room-locked{background:rgba(255,45,85,0.06);border:1px solid rgba(255,45,85,0.18);padding:8px 14px;margin:0 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.room-unlocked{background:rgba(10,255,160,0.06);border:1px solid rgba(10,255,160,0.22);padding:8px 14px;margin:0 16px 12px;}
.room-id-val{font-family:var(--font-hd);font-size:15px;letter-spacing:3px;color:var(--cyan);}
.room-pw-val{font-family:var(--font-hd);font-size:15px;letter-spacing:3px;color:var(--gold);}
.room-lbl{font-family:var(--font-mono);font-size:8px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:3px;}

.result-banner{background:rgba(255,215,0,0.07);border:1px solid rgba(255,215,0,0.2);padding:8px 16px;margin:0 16px 12px;display:flex;align-items:center;gap:8px;}
.result-banner-text{font-family:var(--font-hd);font-size:13px;letter-spacing:2px;color:var(--gold);}

.br-score-table{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:11px;margin-top:8px;}
.br-score-table th{color:var(--muted);letter-spacing:2px;text-transform:uppercase;font-size:9px;padding:5px 10px;text-align:left;border-bottom:1px solid rgba(255,255,255,0.05);}
.br-score-table td{padding:6px 10px;border-bottom:1px solid rgba(255,255,255,0.03);}
.br-score-table tr:hover td{background:rgba(0,245,255,0.03);}
.rank-1 td:first-child{color:var(--gold);}
.rank-2 td:first-child{color:var(--muted);color:#c0c0c0;}
.rank-3 td:first-child{color:#cd7f32;}

.notif-item{background:rgba(0,245,255,0.03);border:1px solid rgba(0,245,255,0.1);padding:12px 14px;margin-bottom:7px;display:flex;align-items:flex-start;gap:10px;animation:pageIn .3s ease;}
.notif-item.unread{border-color:rgba(0,245,255,0.25);background:rgba(0,245,255,0.06);}
.notif-dot-sm{width:7px;height:7px;border-radius:50%;background:var(--cyan);flex-shrink:0;margin-top:5px;}
.notif-title{font-family:var(--font-hd);font-size:12px;letter-spacing:1px;color:var(--white);}
.notif-body{font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-top:3px;line-height:1.5;}

  _ensureKeys(){

  _ensureAdmin(){
    if(!this._d.users.find(u=>u.id==='admin1')){
      this._d.users.push({id:'admin1',phone:'0000000000',password:'ZoneX@Admin#2026',name:'ZoneX Admin',ign:'ADMIN_ZX',uid:'0000000',role:'admin',teamId:null,joinedRole:'admin',status:'approved'});
    }
  },

  save(){
    // Always save to localStorage as backup
    try{localStorage.setItem('zx_backup',JSON.stringify(this._d));}catch(e){}
    // Also save to Firebase if available
    if(_useFirebase && fdb){
      fdb.collection('zonex').doc('state').set(this._d)
        .catch(e=>console.error('Firebase save error:',e));
    }
  },

  async load(){
    g('loading').style.display='flex';
    let loaded = false;

    // Try Firebase first
    if(_useFirebase && fdb){
      try{
        const doc = await fdb.collection('zonex').doc('state').get();
        if(doc.exists){
          this._d = doc.data();
          loaded = true;
        }
      } catch(e){
        console.warn('Firebase load failed, using localStorage:', e);
        _useFirebase = false;
      }
    }

    // Fallback to localStorage
    if(!loaded){
      try{
        const bk = localStorage.getItem('zx_backup');
        if(bk){ this._d = JSON.parse(bk); loaded = true; }
      }catch(e){}
    }

    this._ensureKeys();
    this._ensureAdmin();

    // If brand new — seed admin and save
    if(!loaded){
      this.save();
    }

    this._loaded = true;
    g('loading').style.display='none';
    g('auth-page').style.cssText='display:flex';
  },

  // Real-time listener — only works with Firebase
  startLiveSync(){
    if(!_useFirebase || !fdb) return; // Skip if no Firebase
    const unsub = fdb.collection('zonex').doc('state').onSnapshot(doc=>{
      if(doc.exists && cu){
        const newData = doc.data();
        this._d = newData;
        if(!this._d.chat) this._d.chat={};
        if(!this._d.pointTables) this._d.pointTables={};
        updateNotifBadge();
        buildSidebar();
      }
    });
    this._listeners.push(unsub);
  },

  get users(){return this._d.users||[];},
  get tournaments(){return this._d.tournaments||[];},
  get teams(){return this._d.teams||[];},
  get registrations(){return this._d.registrations||[];},
  get matches(){return this._d.matches||[];},
  get requests(){return this._d.requests||[];},
  get seasons(){return this._d.seasons||[];},
};

function doLogin(){
  const ph=v('lp').replace(/\D/g,''),pw=v('lw');
  const u=DB.users.find(x=>x.phone.replace(/\D/g,'')===ph&&x.password===pw);
  if(!u){set('le','⚠ INVALID CREDENTIALS');return;}
  // Block pending/banned - allow approved OR undefined (legacy users)
  if(u.status==='pending'){set('le','⚠ ACCOUNT PENDING ADMIN APPROVAL');return;}
  if(u.status==='banned'){set('le','⚠ ACCOUNT BANNED — CONTACT ADMIN');return;}
  cu=u;showApp();
}
function doRegister(){
  const name=v('rn'),ph=v('rp').replace(/\D/g,''),uid=v('ru'),ign=v('ri'),pw=v('rw');
  const wa=v('rwa').replace(/\D/g,'')||ph;
  if(!name||!ph||!uid||!ign||!pw){set('re','⚠ ALL FIELDS REQUIRED');return;}
  if(ph.length<10){set('re','⚠ INVALID PHONE NUMBER');return;}
  if(DB.users.find(u=>u.phone.replace(/\D/g,'')===ph)){set('re','⚠ PHONE ALREADY REGISTERED — ONE PROFILE PER NUMBER');return;}
  if(DB.users.find(u=>u.uid===uid&&u.role!=='admin')){set('re','⚠ FREE FIRE UID ALREADY REGISTERED');return;}

  const needsApproval = DB._d.settings && DB._d.settings.requireApproval;
  const status = needsApproval ? 'pending' : 'approved';

  const u={id:'u'+Date.now(),phone:ph,whatsapp:wa,password:pw,name,ign,uid,role:regRole,teamId:null,joinedRole:regRole,status:status};
  DB.users.push(u);

              <div style="color:#ffc107;margin-top:8px;font-size:10px;">⚠ These will be sent to your number once approved.</div>
            </div>
          </div>
          <button class="btn btn-cyan" style="margin-top:20px;width:100%;padding:14px;" onclick="location.reload()">← BACK TO LOGIN</button>
        </div>
      </div>`;
    return;
  }

  cu = u;
  showApp();
}

function getMyNotifCount(){
  const matchAlerts=DB.requests.filter(r=>r.toUserId===cu.id&&['match_scheduled','room_released','match_result'].includes(r.type)&&r.status==='unread').length;
  if(cu.role==='player'){
    return matchAlerts+DB.requests.filter(r=>r.toUserId===cu.id&&r.type==='captain_invite'&&r.status==='pending').length;
  }
  if(cu.role==='captain'){
    return matchAlerts+DB.requests.filter(r=>r.toUserId===cu.id&&r.type==='player_request'&&r.status==='pending').length;
  }
  if(cu.role==='admin'){
    const roleReqs=DB.requests.filter(r=>r.type==='role_change'&&r.status==='pending').length;
    const dailyJoinPending=DB.requests.filter(r=>r.type==='daily_join'&&r.status==='pending').length;
    const chatUnread=DB.teams?DB.teams.reduce((sum,t)=>{
      const key='adminchat_'+t.id;
      return sum+(DB._d.chat&&DB._d.chat[key]?DB._d.chat[key].msgs.filter(m=>m.userId!=='admin1'&&!m.read).length:0);
    },0):0;
    return roleReqs+dailyJoinPending+chatUnread;
  }
  return matchAlerts;
}

function navTeamOrProfile(){

function updateMobNav(page){
  // Update active state on mobile bottom nav
  ['dashboard','tournaments','matches','notifications'].forEach(p=>{
    const el=document.getElementById('mob-'+p);
    if(el) el.classList.toggle('active', p===page);
  });
  // Team/profile button
  const teamBtn=document.getElementById('mob-team');
  if(teamBtn) teamBtn.classList.toggle('active', ['my-team','teams','profile'].includes(page));
  // Update notif badge on mobile
  const cnt=getMyNotifCount();
  const badge=document.getElementById('mob-notif-badge');
  if(badge){badge.textContent=cnt>9?'9+':cnt;badge.className='mob-nav-badge'+(cnt>0?' show':'');}
  // Close more menu if open
  const mm=document.getElementById('mob-more-menu');
  if(mm) mm.style.display='none';
}

function toggleMobMenu(){
  const mm=document.getElementById('mob-more-menu');
  if(!mm)return;
  if(mm.style.display==='none'){
    // Build more menu items from sidebar
    const items=(menus[cu?.role||'player']||menus.player).filter(p=>!['dashboard','tournaments','matches','notifications'].includes(p.id));
    const mi=document.getElementById('mob-more-items');
    if(mi) mi.innerHTML=items.map(p=>`
      <button onclick="nav('${p.id}')" style="display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;color:#fff;padding:12px 8px;font-family:'Inter',sans-serif;font-size:14px;font-weight:500;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.05);">
        ${ico[p.id]?`<span style="width:20px;height:20px;color:#607d8b">${ico[p.id]}</span>`:''}
        ${p.l}
      </button>`).join('');
    mm.style.display='block';
  } else {
    mm.style.display='none';
  }
}

// Close more menu when clicking outside
document.addEventListener('click',function(e){
  const mm=document.getElementById('mob-more-menu');
  const btn=document.getElementById('mob-more');
  if(mm&&btn&&!mm.contains(e.target)&&!btn.contains(e.target)){
    mm.style.display='none';
  }
});

function nav(page){
  document.querySelectorAll('.sb-item').forEach(el=>el.classList.remove('active'));
  const sb=g('sb-'+page);if(sb)sb.classList.add('active');
  updateMobNav(page);
  ({dashboard:pDash,seasons:pSeasons,tournaments:pTour,schedule:pSchedule,matches:pMatches,teams:pTeams,players:pPlayers,notifications:pNotifications,approvals:pAdminApprovals,'image-manager':pImageManager,'point-table':pPointTable,'team-chats':pTeamChats,'admin-chat':()=>openMyAdminChat(),'add-tournament':pAddTour,'my-team':pMyTeam,profile:pProfile}[page]||pDash)(g('mc'));
}

async function confirmReg(tId,teamId,needsPay,amt){
  let paymentId='FREE';
  if(needsPay){
    const t=DB.tournaments.find(x=>x.id===tId);
    try{
      set('reg-err','');
      const btn=document.querySelector('#mo-body .btn-gold');
      if(btn){btn.disabled=true;btn.textContent='⏳ OPENING PAYMENT...';}
      paymentId = await openRazorpay({
        amount: amt,
        description: 'Tournament Entry: '+(t?.name||'')
      });
    } catch(e){
      const btn=document.querySelector('#mo-body .btn-gold');
      if(btn){btn.disabled=false;btn.textContent=`💳 PAY ₹${amt} & REGISTER`;}
      if(e!=='dismissed') showToast('⚠ PAYMENT FAILED, TRY AGAIN',true);
      return;
    }
  }
  const isPaid = paymentId && paymentId !== 'FREE';
  DB.registrations.push({id:'r'+Date.now(),tournamentId:tId,teamId,captainId:cu.id,paymentId,status:isPaid?'confirmed':'pending',at:Date.now()});

  // Notification to captain
  const tObj=DB.tournaments.find(x=>x.id===tId);
  DB.requests.push({
    id:'notif'+Date.now(),type:'match_result',
    toUserId:cu.id,fromUserId:'admin1',
    status:'unread',at:Date.now(),
    title: isPaid ? '✅ Tournament Registration Confirmed!' : '⏳ Registration Pending',
    body: isPaid
      ? `Payment verified! Team registered for "${tObj?.name||'Tournament'}". Match schedule milega admin se.`
      : `Registration request bheja gaya "${tObj?.name||'Tournament'}" ke liye. Admin approve karega.`
  });

  DB.save();closeMo();

function previewQR(e){
  const f=e.target.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    const data=ev.target.result;
    g('qr-data').value=data;
    g('qr-preview-wrap').innerHTML=`<img src="${data}" style="width:140px;height:140px;object-fit:contain;border:1px solid rgba(255,215,0,0.3);cursor:pointer" onclick="g('qr-file-inp').click()" title="Click to change"/>`;

}

// ── SCHEDULE / MATCHES PAGE ──
function pSchedule(el){
  const allMatches=DB.matches||[];
  const isAdmin=cu.role==='admin';

  // Normalize type check
  const isDaily=m=>m.matchType==='daily'||m.matchType==='DAILY';
  const isTour=m=>!isDaily(m);

  // For captain/player — find their team
  const myTeam=DB.teams.find(t=>t.captainId===cu.id||t.members.includes(cu.id));

  // Tournament matches
  let tourMatches=allMatches.filter(isTour);
  if(!isAdmin && myTeam){
    // Only show matches where their team is playing
    tourMatches=tourMatches.filter(m=>
      m.team1Id===myTeam.id ||
      m.team2Id===myTeam.id ||
      (m.brTeamIds||[]).includes(myTeam.id)
    );
  }

  // Daily matches — admin ke liye matches page mein NAHI dikhenge (sirf profile mein)
  const dailyMatches=(!isAdmin)?allMatches.filter(isDaily):[];

  // Sort state
  let sortBy=el._sortBy||'date';

  const sortedTour=[...tourMatches].sort((a,b)=>{
    if(sortBy==='date') return (b.createdAt||0)-(a.createdAt||0);
    if(sortBy==='round') return (a.round||'').localeCompare(b.round||'');
    if(sortBy==='status') return (a.status||'').localeCompare(b.status||'');
    return 0;
  });

  el.innerHTML=`<div style="animation:pageIn .35s ease">
    <div class="sec-hd">
      <div class="sec-title"><div class="sec-bar"></div>MATCHES</div>
      ${isAdmin?`<button class="btn btn-purple btn-sm" onclick="openAddMatchType()">+ NEW MATCH</button>`:''}
    </div>

    ${isAdmin?`
    <!-- Admin: only tournament tab + sort -->
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px">
      <div style="font-family:var(--font-mono);font-size:10px;color:var(--muted);letter-spacing:2px">🏆 TOURNAMENT MATCHES (${sortedTour.length})</div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-ghost btn-xs ${sortBy==='date'?'btn-cyan':''}" onclick="document.getElementById('mc')._sortBy='date';pSchedule(document.getElementById('mc'))">DATE</button>
        <button class="btn btn-ghost btn-xs ${sortBy==='round'?'btn-cyan':''}" onclick="document.getElementById('mc')._sortBy='round';pSchedule(document.getElementById('mc'))">ROUND</button>
        <button class="btn btn-ghost btn-xs ${sortBy==='status'?'btn-cyan':''}" onclick="document.getElementById('mc')._sortBy='status';pSchedule(document.getElementById('mc'))">STATUS</button>
      </div>
    </div>
    <div id="match-panel-tournament">
      ${sortedTour.length
        ?sortedTour.map(m=>renderMatchCard(m)).join('')
        :`<div style="text-align:center;padding:40px;color:var(--muted);font-family:var(--font-mono);font-size:10px;letter-spacing:2px">// NO TOURNAMENT MATCHES YET</div>`}
    </div>`

    :`
    <!-- Captain/Player: Tournament + Daily tabs -->
    <div class="page-tabs" style="margin-bottom:18px">
      <button class="page-tab active" id="mtab-tournament" onclick="switchMatchTab('tournament')">🏆 MY MATCHES</button>
      <button class="page-tab" id="mtab-daily" onclick="switchMatchTab('daily')">📅 DAILY MATCHES</button>
    </div>

    <div id="match-panel-tournament">
      ${sortedTour.length
        ?sortedTour.map(m=>renderMatchCard(m)).join('')
        :`<div style="text-align:center;padding:40px;color:var(--muted);font-family:var(--font-mono);font-size:10px;letter-spacing:2px">// KOI TOURNAMENT MATCH ASSIGN NAHI HUA</div>`}

function renderMatchCard(m){
  const isDaily=m.matchType==='daily'||m.matchType==='DAILY';
  const accentColor=isDaily?'var(--green)':'var(--gold)';
  const typeBadgeClass=isDaily?'mt-daily':'mt-br';
  const typeLabel=isDaily?'DAILY':'TOURNAMENT';

  // For daily match — show join status
  let joinSection='';
  if(isDaily && cu.role==='captain'){
    const mt=DB.teams.find(t=>t.captainId===cu.id);
    const existReq=mt?DB.requests.find(r=>r.type==='daily_join'&&r.matchId===m.id&&r.teamId===mt.id):null;
    if(existReq){
      if(existReq.status==='pending'){
        joinSection=`<div style="padding:0 16px 12px"><span class="badge b-ongoing">⏳ JOIN REQUEST PENDING</span></div>`;
      } else if(existReq.status==='approved'){
        joinSection=`<div style="padding:0 16px 12px"><span class="badge b-open">✓ APPROVED — CHECK ROOM DETAILS</span></div>`;
      } else {
        joinSection=`<div style="padding:0 16px 12px"><span class="badge b-closed">✗ REJECTED</span></div>`;
      }
    } else if(m.status!=='closed'){
      joinSection=`<div style="padding:0 16px 12px"><button class="btn btn-green btn-sm" onclick="openDailyJoin('${m.id}')">⚡ JOIN MATCH</button></div>`;
    }
  }

  // Room info (only show to approved teams or admin)
  let roomSection='';
  if(m.roomId||m.roomPass){
    if(cu.role==='admin'){
      roomSection=`<div class="room-unlocked" style="margin:0 16px 12px"><div style="display:flex;gap:20px;flex-wrap:wrap"><div><div class="room-lbl">Room ID</div><div class="room-id-val">${m.roomId||'—'}</div></div><div><div class="room-lbl">Password</div><div class="room-pw-val">${m.roomPass||'—'}</div></div></div></div>`;
    } else if(isDaily){
      const mt=DB.teams.find(t=>t.captainId===cu.id||t.members.includes(cu.id));
      const approved=mt&&DB.requests.find(r=>r.type==='daily_join'&&r.matchId===m.id&&r.teamId===mt.id&&r.status==='approved');
      if(approved){
        roomSection=`<div class="room-unlocked" style="margin:0 16px 12px"><div style="display:flex;gap:20px;flex-wrap:wrap"><div><div class="room-lbl">Room ID</div><div class="room-id-val">${m.roomId||'—'}</div></div><div><div class="room-lbl">Password</div><div class="room-pw-val">${m.roomPass||'—'}</div></div></div></div>`;
      }
    } else {
      // Tournament match — show room to all team members
      const mt=DB.teams.find(t=>t.captainId===cu.id||t.members.includes(cu.id));
      if(mt&&m.teams&&m.teams.includes(mt.id)){
        roomSection=`<div class="room-unlocked" style="margin:0 16px 12px"><div style="display:flex;gap:20px;flex-wrap:wrap"><div><div class="room-lbl">Room ID</div><div class="room-id-val">${m.roomId||'—'}</div></div><div><div class="room-lbl">Password</div><div class="room-pw-val">${m.roomPass||'—'}</div></div></div></div>`;
      }
    }
  }

  const hasBrSlots=m.brSlots&&Object.keys(m.brSlots).length>0;
  const adminBtns=cu.role==='admin'?`<div style="padding:0 16px 12px;display:flex;gap:6px;flex-wrap:wrap">
    <button class="btn btn-cyan btn-xs" onclick="openMatchDetails('${m.id}')">⚙ MANAGE</button>
    ${hasBrSlots?`<button class="btn btn-purple btn-xs" onclick="openSlotsPanel('${m.id}')">📋 SLOTS</button>`:''}
    <button class="btn btn-red btn-xs" onclick="delMatch('${m.id}')">DEL</button>
  </div>`:'';

  // Support both m.teams[] array AND m.team1Id/m.team2Id fields
  const t1Id=m.team1Id||(m.teams&&m.teams[0])||null;
  const t2Id=m.team2Id||(m.teams&&m.teams[1])||null;
  const t1=t1Id?DB.teams.find(x=>x.id===t1Id):null;
  const t2=t2Id?DB.teams.find(x=>x.id===t2Id):null;
  // Fallback: if team not in DB but name stored, create stub
  const t1obj=t1||(m.team1?{name:m.team1,tag:''}:null);
  const t2obj=t2||(m.team2?{name:m.team2,tag:''}:null);

  const isMyMatch=(()=>{
    if(cu.role==='admin') return false;
    const mt=DB.teams.find(t=>t.captainId===cu.id||t.members?.includes(cu.id));
    if(!mt) return false;
    return (m.teams&&m.teams.includes(mt.id))||(m.team1Id===mt.id)||(m.team2Id===mt.id)||((m.brTeamIds||[]).includes(mt.id));
  })();

  const hexBadge=(t,align)=>{
    const isRight=align==='right';
    return '<div style="display:flex;align-items:center;gap:10px;'+(isRight?'flex-direction:row-reverse;':'')+'">'
      +'<div style="width:40px;height:40px;flex-shrink:0;display:flex;align-items:center;justify-content:center;'
      +'background:linear-gradient(135deg,rgba(139,92,246,0.25),rgba(80,40,180,0.15));'
      +'border:1.5px solid rgba(139,92,246,0.5);'
      +'clip-path:polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);'
      +'font-weight:900;font-size:15px;color:#8b5cf6;">'
      +(t?t.name[0].toUpperCase():'?')
      +'</div>'
      +'<div style="'+(isRight?'text-align:right':'')+'">'
      +'<div style="font-weight:800;font-size:13px;letter-spacing:1.5px;color:#fff">'+(t?t.name:'TBD')+'</div>'
      +'<div style="font-size:10px;color:var(--muted);margin-top:1px">'+(t?t.tag||'':'')+'</div>'
      +'</div></div>';
  };

  const borderCol=isMyMatch?'rgba(0,207,255,0.4)':isDaily?'rgba(0,230,118,0.25)':'rgba(139,92,246,0.25)';
  const glowCol=isDaily?'rgba(0,200,100,0.12)':'rgba(139,92,246,0.15)';

  return '<div style="border:1px solid '+borderCol+';border-radius:10px;margin-bottom:14px;overflow:hidden;background:rgba(6,10,28,0.95)">'

    // ── HEADER ──
    +'<div style="position:relative;min-height:85px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(135deg,rgba(8,15,40,0.98),rgba(15,8,35,0.95));border-bottom:1px solid rgba(255,255,255,0.06);overflow:hidden;">'
    +'<div style="position:absolute;inset:0;background:radial-gradient(ellipse at 80% 50%,'+glowCol+' 0%,transparent 70%)"></div>'
    +'<div style="position:relative;z-index:1;padding:14px 16px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px">'
    +'<div>'
    +'<div style="font-weight:800;font-size:15px;letter-spacing:2px;color:#fff">'+(isDaily?'📅 ':'🏆 ')+(m.label||m.tournament||m.name||(isDaily?'DAILY MATCH':'TOURNAMENT MATCH'))+'</div>'
    +(m.round?'<div style="font-family:var(--font-mono);font-size:9px;color:'+(isDaily?'var(--green)':'var(--purple)')+';letter-spacing:3px;margin-top:5px;display:flex;align-items:center;gap:6px">'
    +'<div style="width:14px;height:1px;background:currentColor;opacity:.5"></div>'+m.round+'<div style="width:40px;height:1px;background:currentColor;opacity:.3"></div></div>':'')
    +'</div>'
    +'<span class="badge '+(m.status==='open'?'b-open':m.status==='ongoing'?'b-ongoing':'b-closed')+'">'+(m.status||'open').toUpperCase()+'</span>'
    +'</div></div>'

    // ── INFO ROW ──
    +'<div style="padding:10px 16px;display:flex;gap:10px;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,0.05);background:rgba(255,255,255,0.02);align-items:center">'
    +(isMyMatch?'<span style="background:rgba(0,207,255,0.1);color:#00cfff;border:1px solid rgba(0,207,255,0.3);border-radius:4px;font-size:9px;font-weight:700;letter-spacing:1.5px;padding:3px 8px">YOUR MATCH</span>':'')
    +'<span style="font-family:var(--font-mono);font-size:11px;color:var(--cyan)">📅 '+(m.date||'TBD')+'</span>'
    +'<span style="font-family:var(--font-mono);font-size:11px;color:var(--gold)">⏰ '+(m.time||'TBD')+'</span>'
    +(m.map?'<span style="font-family:var(--font-mono);font-size:11px;color:var(--muted)">🗺 '+m.map+'</span>':'')
    +((m.gameMode||m.matchFormat||m.mode||m.format)?'<span style="background:rgba(255,107,43,0.1);color:var(--orange);border:1px solid rgba(255,107,43,0.3);border-radius:4px;font-size:9px;font-weight:700;padding:3px 8px">🎮 '+((m.gameMode||m.mode)||'')+((m.matchFormat||m.format)?' '+(m.matchFormat||m.format):'')+'</span>':'')
    +(m.entry?'<span style="font-family:var(--font-mono);font-size:11px;color:var(--gold)">💰 '+m.entry+'</span>':'')
    +(m.prize?'<span style="font-family:var(--font-mono);font-size:11px;color:var(--gold)">🏆 '+m.prize+'</span>':'')
    +(m.maxTeams?(()=>{ const joined=(m.brTeamIds||[]).length; const confirmed=isDaily?DB.requests.filter(r=>r.matchId===m.id&&r.status==='approved').length:joined; const full=joined>=m.maxTeams; return '<span style="font-family:var(--font-mono);font-size:11px;color:'+(full?'var(--red)':'var(--cyan)')+'">👥 '+confirmed+'/'+m.maxTeams+(full?' FULL':' slots')+'</span>'; })():'')
    +'</div>'

    // ── TEAMS SECTION (BR grid OR classic VS) ──
    +(()=>{
      const isBR=(m.maxTeams&&m.maxTeams>2)||(m.matchFormat==='BR')||(m.gameMode==='BR');
      if(isBR){
        // BR: show joined teams as grid chips
        const joinedIds=m.brTeamIds||[];
        const joinedTeams=joinedIds.map(id=>DB.teams.find(t=>t.id===id)).filter(Boolean);
        const max=m.maxTeams||12;
        const slots=m.brSlots||{};
        if(!joinedTeams.length) return '';
        // Build team chips sorted by slot
        const sorted=joinedTeams.slice().sort((a,b)=>{
          const sa=parseInt(Object.entries(slots).find(([,v])=>v===a.id)?.[0]||99);
          const sb=parseInt(Object.entries(slots).find(([,v])=>v===b.id)?.[0]||99);
          return sa-sb;
        });
        const chips=sorted.map(t=>{
          const slotNo=Object.entries(slots).find(([,v])=>v===t.id)?.[0]||'?';
          const isWinner=m.result&&m.result===t.name;
          return '<div style="display:flex;align-items:center;gap:6px;background:'+(isWinner?'rgba(0,230,118,0.08)':'rgba(255,255,255,0.03)')+';border:1px solid '+(isWinner?'rgba(0,230,118,0.4)':'rgba(255,255,255,0.08)')+';border-radius:6px;padding:5px 8px;min-width:0">'
            +'<span style="font-family:var(--font-mono);font-size:9px;color:var(--purple);min-width:18px">#'+slotNo+'</span>'
            +'<div style="width:22px;height:22px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(139,92,246,0.3),rgba(80,40,180,0.2));clip-path:polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);font-weight:900;font-size:10px;color:#b388ff">'+t.name[0].toUpperCase()+'</div>'
            +'<div style="min-width:0"><div style="font-weight:700;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px">'+(isWinner?'🏆 ':'')+t.name+'</div>'
            +'<div style="font-family:var(--font-mono);font-size:9px;color:var(--muted)">'+t.tag+'</div></div>'
            +'</div>';
        }).join('');
        const remaining=max-joinedTeams.length;
        const emptyChips=remaining>0?Array.from({length:Math.min(remaining,max-joinedTeams.length)},(_,i)=>
          '<div style="display:flex;align-items:center;gap:5px;background:rgba(255,255,255,0.01);border:1px dashed rgba(255,255,255,0.07);border-radius:6px;padding:5px 8px">'
          +'<span style="font-family:var(--font-mono);font-size:9px;color:rgba(255,255,255,0.15)">#'+(joinedTeams.length+i+1)+'</span>'
          +'<span style="font-family:var(--font-mono);font-size:9px;color:rgba(255,255,255,0.12)">OPEN</span></div>'
        ).join(''):'';
        return '<div style="padding:10px 14px 12px;border-top:1px solid rgba(255,255,255,0.05)">'
          +'<div style="font-family:var(--font-mono);font-size:8px;color:var(--purple);letter-spacing:2px;margin-bottom:8px">🎯 REGISTERED TEAMS</div>'
          +'<div style="display:flex;flex-wrap:wrap;gap:6px">'+chips+emptyChips+'</div>'
          +'</div>';
      } else {
        // Classic 1v1 VS
        if(!t1obj&&!t2obj) return '';
        return '<div style="padding:12px 14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px">'
          +'<div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:8px;padding:10px 12px;'+(m.result&&m.result===t1obj?.name?'border-color:rgba(0,230,118,0.4);background:rgba(0,230,118,0.05)':'')+'">'
          +hexBadge(t1obj,'left')+'</div>'
          +'<div style="font-family:var(--font-hd);font-size:18px;font-weight:900;background:linear-gradient(135deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center">VS</div>'
          +'<div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:8px;padding:10px 12px;'+(m.result&&m.result===t2obj?.name?'border-color:rgba(0,230,118,0.4);background:rgba(0,230,118,0.05)':'')+'">'
          +hexBadge(t2obj,'right')+'</div>'
          +'</div>';
      }
    })()

    // ── RESULT ──
    +(m.result?'<div class="result-banner" style="margin:0 14px 10px"><span style="font-size:16px">🏆</span><span class="result-banner-text">WINNER: '+m.result+'</span></div>':'')

    // ── ROOM ──
    +roomSection

    // ── LOCKED msg ──
    +(!m.roomId&&!m.roomPass&&cu.role!=='admin'&&(isMyMatch||(isDaily&&joinSection.includes('APPROVED')))?
    '<div style="margin:0 14px 12px;padding:10px 14px;background:rgba(244,67,54,0.07);border:1px solid rgba(244,67,54,0.2);border-radius:6px;display:flex;align-items:center;gap:10px">'
    +'<span style="font-size:15px">🔒</span>'
    +'<span style="font-family:var(--font-mono);font-size:10px;color:var(--red);letter-spacing:1px">Room ID will be released by admin before match</span>'
    +'</div>':'')

    +joinSection
    +adminBtns
    +'</div>';
}

function _buildTeamsList(containerId, csMode){
  let teams=DB.teams;
  if(containerId){
    const regIds=DB.registrations.filter(r=>r.tournamentId===containerId).map(r=>r.teamId);
    teams=teams.filter(t=>regIds.includes(t.id));
  }
  if(!teams.length) return`<div style="text-align:center;padding:20px;color:var(--muted);font-family:var(--font-mono);font-size:10px">// NO TEAMS FOUND</div>`;
  return teams.map(t=>`
    <div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.04)">
      <input type="checkbox" class="nm-team-cb" id="nm-t-${t.id}" value="${t.id}" style="width:16px;height:16px;cursor:pointer;accent-color:var(--cyan)" ${csMode?'onchange="_nmCSLimit(this)"':''}/>
      <label for="nm-t-${t.id}" style="cursor:pointer;flex:1">
        <div style="font-size:13px;font-weight:600">${t.name} <span style="font-family:var(--font-mono);font-size:9px;color:var(--purple)">[${t.tag}]</span></div>
        <div style="font-family:var(--font-mono);font-size:9px;color:var(--muted)">${t.members.length+1} members</div>
      </label>
    </div>`).join('');
}

function _nmRefreshTeams(){
  const cid=g('nm-container')?.value||'';
  const list=g('nm-teams-list');
  if(list) list.innerHTML=_buildTeamsList(cid, _nmMode==='CS');
}
function _nmCSLimit(cb){
  const checked=[...document.querySelectorAll('.nm-team-cb:checked')];
  if(checked.length>2){cb.checked=false;showToast('⚠ CS MODE: SIRF 2 TEAMS',true);}
}
function _nmSelectAll(){
  document.querySelectorAll('.nm-team-cb').forEach(cb=>cb.checked=true);
  if(_nmMode==='CS'){[...document.querySelectorAll('.nm-team-cb')].forEach((cb,i)=>cb.checked=i<2);showToast('⚠ CS MODE: SIRF 2 TEAMS',true);}
}
function _nmClearAll(){document.querySelectorAll('.nm-team-cb').forEach(cb=>cb.checked=false);}
function _nmPreviewQR(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    if(g('nm-qr-data'))g('nm-qr-data').value=ev.target.result;
    if(g('nm-qr-wrap'))g('nm-qr-wrap').innerHTML=`<img src="${ev.target.result}" style="width:120px;height:120px;object-fit:contain;border:1px solid rgba(255,215,0,0.3);cursor:pointer" onclick="g('nm-qr-file').click()"/>`;
  };r.readAsDataURL(f);
}
function _createMatch(){
  const date=v('nm-date');
  if(!date){set('nm-err','⚠ DATE REQUIRED');return;}
  if(_nmType==='daily'){
    const lbl=v('nm-lbl');
    if(!lbl){set('nm-err','⚠ MATCH LABEL REQUIRED');return;}
    const entry=v('nm-entry');
    const needsPay=entry&&entry.toLowerCase()!=='free'&&entry.trim()!=='';
    const qrImg=g('nm-qr-data')?.value||'';
    if(needsPay&&!qrImg){set('nm-err','⚠ PAID MATCH KE LIYE QR REQUIRED');return;}
    DB.matches.push({id:'m'+Date.now(),matchType:'daily',gameMode:_nmMode,matchFormat:_nmFormat,
      label:lbl,date,time:v('nm-time'),map:'',maxTeams:parseInt(v('nm-max'))||12,
      entry,prize:v('nm-prize'),qrImage:qrImg,status:'open',teams:[],result:'',createdAt:Date.now()});
    DB.save();closeMo();showToast('✓ DAILY MATCH CREATED',false,'ok');
    pMatches(g('mc'));setTimeout(()=>switchMatchTab('daily'),50);
  } else {
    const sel=[...document.querySelectorAll('.nm-team-cb:checked')].map(el=>el.value);
    if(_nmMode==='CS'&&sel.length!==2){set('nm-err','⚠ CS MODE MEIN EXACTLY 2 TEAMS CHAHIYE');return;}
    const round=g('nm-round')?.value||'Round 1';
    const cid=g('nm-container')?.value||'';
    const container=DB.tournaments.find(t=>t.id===cid)||DB.seasons.find(s=>s.id===cid);
    DB.matches.push({id:'m'+Date.now(),matchType:'tournament',gameMode:_nmMode,matchFormat:_nmFormat,
      tournament:container?container.name:'',containerId:cid,round,label:round,
      date,time:v('nm-time'),map:'',prize:'',teams:sel,status:'open',result:'',createdAt:Date.now()});
    DB.save();closeMo();showToast('✓ TOURNAMENT MATCH CREATED',false,'ok');
    pMatches(g('mc'));
  }
}
function openAddTournamentMatch(){_nmType='tournament';_nmMode='BR';_nmFormat='SQUAD';_renderNewMatchModal();}
function openAddDailyMatch(){_nmType='daily';_nmMode='BR';_nmFormat='SQUAD';_renderNewMatchModal();}
function previewDmQR(e){_nmPreviewQR(e);}
function createDailyMatch(){_createMatch();}
function createTournamentMatch(){_createMatch();}

// ── Slot Assignment Helper ──
function assignSlot(m,teamId){
  if(!m.brSlots)m.brSlots={};
  const existing=Object.entries(m.brSlots).find(([,v])=>v===teamId);
  if(existing)return parseInt(existing[0]);
  const max=m.maxTeams||12;
  for(let i=1;i<=max;i++){if(!m.brSlots[i]){m.brSlots[i]=teamId;return i;}}
  return null;
}

async function submitDailyJoin(matchId,teamId,needsPay,amt){
  let paymentId='FREE';
  if(needsPay){
    const m=DB.matches.find(x=>x.id===matchId);
    try{
      const btn=g('djoin-btn');
      if(btn){btn.disabled=true;btn.textContent='⏳ OPENING PAYMENT...';}
      paymentId = await openRazorpay({
        amount: amt,
        description: 'Daily Match Entry: '+(m?.label||m?.date||'')
      });
    } catch(e){
      const btn=g('djoin-btn');
      if(btn){btn.disabled=false;btn.textContent=`💳 PAY ₹${amt} & JOIN`;}
      if(e!=='dismissed') showToast('⚠ PAYMENT FAILED, TRY AGAIN',true);
      return;
    }
  }
  const m=DB.matches.find(x=>x.id===matchId);
  const mt=DB.teams.find(x=>x.id===teamId);

  // Paid → auto approve, Free → admin approval chahiye
  const isPaid = paymentId && paymentId !== 'FREE';
  const autoStatus = isPaid ? 'approved' : 'pending';

  DB.requests.push({
    id:'djoin_'+Date.now(),
    type:'daily_join',
    matchId,teamId,
    captainId:cu.id,
    paymentId,
    status: autoStatus,
    at:Date.now(),
    toUserId:'admin1',
    fromUserId:cu.id,
    title:`📅 Daily Match Join: ${mt?.name||'Team'}`,
    body:`Team: ${mt?.name||'—'} (${mt?.tag||'—'}) — Match: ${m?.label||m?.date||'—'}${isPaid?' — Payment: '+paymentId:''}`
  });

  // Auto approve hone par team match mein add karo + notification
  if(isPaid){
    if(!m.teams) m.teams=[];
    if(!m.teams.includes(teamId)) m.teams.push(teamId);
    // Assign slot number
    const slotNo=assignSlot(m,teamId);
    // Also add to brTeamIds if BR match
    if(m.matchFormat==='BR'||m.gameMode==='BR'||(m.maxTeams&&m.maxTeams>2)){
      if(!m.brTeamIds)m.brTeamIds=[];
      if(!m.brTeamIds.includes(teamId))m.brTeamIds.push(teamId);
    }
    DB.requests.push({
      id:'notif'+Date.now(),type:'match_result',
      toUserId:cu.id,fromUserId:'admin1',
      status:'unread',at:Date.now(),
      title:'✅ Match Join Confirmed!',
      body:`Payment verified! Team "${mt?.name||'Team'}" match ke liye confirm ho gayi. Tumhara Slot No. #${slotNo||'—'} hai. Room details milenge match se pehle.`
    });
    DB.save();closeMo();
    showToast(`✅ PAYMENT DONE! SLOT #${slotNo||'—'} ASSIGNED!`,false,'ok');
  } else {
    DB.save();closeMo();
    showToast('📩 JOIN REQUEST SENT! ADMIN APPROVE KAREGA',false,'ok');
  }

  pSchedule(g('mc'));
  if(cu.role!=='admin') setTimeout(()=>{switchMatchTab('daily');},100);
}

    const teamId=slots[i];
    if(!teamId){

function approveDailyJoin(reqId,matchId){
  const r=DB.requests.find(x=>x.id===reqId);
  if(!r)return;
  r.status='approved';
  // Add team to match's teams array + assign slot
  const m=DB.matches.find(x=>x.id===matchId);
  if(m){
    if(!m.teams)m.teams=[];
    if(!m.teams.includes(r.teamId))m.teams.push(r.teamId);
    // Add to brTeamIds if needed
    if(!m.brTeamIds)m.brTeamIds=[];
    if(!m.brTeamIds.includes(r.teamId))m.brTeamIds.push(r.teamId);
    // Assign slot
    r.slotNo=assignSlot(m,r.teamId);
  }
  // Notify captain with slot number
  const team=DB.teams.find(t=>t.id===r.teamId);
  DB.requests.push({id:'notif'+Date.now(),type:'match_result',toUserId:r.captainId,fromUserId:'admin1',status:'unread',at:Date.now(),
    title:'✅ Daily Match Join Approved!',
    body:`Tumhara team "${team?.name||'Team'}" approved ho gaya! Tumhara Slot No. #${r.slotNo||'—'} hai. Room details milenge match se pehle.`
  });
  DB.save();closeMo();showToast(`✓ JOIN APPROVED — SLOT #${r.slotNo||'—'}`,false,'ok');
}

function rejectDailyJoin(reqId){

function confirmAddTeamsToMatch(matchId){
  const m=DB.matches.find(x=>x.id===matchId);if(!m)return;
  const selected=[...document.querySelectorAll('[id^="at-"]:checked')].map(el=>el.value);

  selected.forEach(tid=>{if(!m.teams.includes(tid))m.teams.push(tid);});

}

// ── ALL TEAMS (Admin) ──
function pTeams(el){
  el.innerHTML=`<div style="animation:pageIn .35s ease"><div class="sec-hd"><div class="sec-title"><div class="sec-bar"></div>ALL TEAMS</div></div>`;
  if(!DB.teams.length){g('mc').innerHTML+=`<div style="text-align:center;padding:40px;color:var(--muted);font-family:var(--font-mono);font-size:10px;letter-spacing:2px">// NO TEAMS YET</div>`;return;}
  const mc=g('mc');
  DB.teams.forEach(team=>{
    const cap=DB.users.find(u=>u.id===team.captainId);
    const members=team.members.map(id=>DB.users.find(u=>u.id===id)).filter(Boolean);
    mc.innerHTML+=`<div class="xcard">
      <div class="team-hero">
        <div class="team-badge">${team.name[0]}</div>
        <div style="flex:1"><div class="team-name-big">${team.name}</div><div class="team-tag-sm">${team.tag}</div>
        <div style="font-family:var(--font-mono);font-size:9px;color:var(--muted);margin-top:3px">CAPTAIN: ${cap?.name||'—'} (${cap?.ign||'—'})</div></div>
        <div style="text-align:right">
          <div style="font-family:var(--font-hd);font-size:24px;color:var(--purple)">${members.length}<span style="font-size:11px;color:var(--muted)">/6</span></div>
          <button class="btn btn-red btn-xs" style="margin-top:6px" onclick="deleteTeam('${team.id}')">🗑 DELETE TEAM</button>
        </div>
      </div>
      ${members.map(m=>`<div class="prow"><div class="prow-l">
        <div class="av av-c">${m.name[0]}</div>
        <div><div class="prow-name">${m.name}</div><div class="prow-uid">IGN: ${m.ign} · UID: ${m.uid}</div></div>
      </div>
      <button class="btn btn-red btn-xs" onclick="admRm('${team.id}','${m.id}')">REMOVE</button>
      </div>`).join('')||`<div style="color:var(--muted);font-family:var(--font-mono);font-size:10px;padding:8px">// Empty team</div>`}
    </div>`;
  });
}
function admRm(tid,pid){
  const t=DB.teams.find(x=>x.id===tid);
  const u=DB.users.find(x=>x.id===pid);
  if(!t||!u) return;

  // If removing captain — must assign new captain first
  if(t.captainId===pid){
    const otherMembers=t.members.filter(id=>id!==pid).map(id=>DB.users.find(u=>u.id===id)).filter(Boolean);
    if(!otherMembers.length){
      // No other members — delete team
      if(confirm('Team mein koi aur member nahi hai. Team delete kar dein?')) deleteTeam(tid);
      return;
    }
    // Show new captain picker
    openMo(`<button class="mo-close" onclick="closeMo()">✕</button>
      <div class="mo-title">👑 NEW CAPTAIN SELECT KARO</div>
      <div style="font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-bottom:14px">
        "${u.name}" captain hai. Remove karne se pehle naya captain choose karo.
      </div>
      ${otherMembers.map(m=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);border-radius:4px;margin-bottom:7px">
          <div>
            <div style="font-size:13px;font-weight:700">${m.name}</div>
            <div style="font-family:var(--font-mono);font-size:9px;color:var(--muted)">IGN: ${m.ign}</div>
          </div>
          <button class="btn btn-gold btn-xs" onclick="assignNewCaptainAndRemove('${tid}','${pid}','${m.id}')">👑 MAKE CAPTAIN</button>
        </div>`).join('')}
    `);
    return;
  }

  // Normal member remove
  t.members=t.members.filter(i=>i!==pid);
  u.teamId=null;
  DB.save();pTeams(g('mc'));showToast('REMOVED');
}

function assignNewCaptainAndRemove(teamId, oldCapId, newCapId){
  const t=DB.teams.find(x=>x.id===teamId);
  const oldCap=DB.users.find(u=>u.id===oldCapId);
  const newCap=DB.users.find(u=>u.id===newCapId);
  if(!t||!newCap) return;

  // Assign new captain
  t.captainId=newCapId;
  newCap.role='captain';
  newCap.teamId=teamId;

  // Demote old captain to player and remove from team
  if(oldCap){ oldCap.role='player'; oldCap.teamId=null; }
  t.members=t.members.filter(id=>id!==oldCapId);

  DB.save();
  closeMo();
  showToast(`👑 ${newCap.name} AB CAPTAIN HAI`,false,'ok');
  pTeams(g('mc'));
}

function deleteTeam(teamId){
  if(!confirm('Ye team delete kar do? Sare members alag ho jayenge.')) return;
  const team=DB.teams.find(t=>t.id===teamId);
  if(!team) return;

  // Free all members
  team.members.forEach(uid=>{
    const u=DB.users.find(x=>x.id===uid);
    if(u){ u.teamId=null; }
  });
  // Free captain
  const cap=DB.users.find(u=>u.id===team.captainId);
  if(cap){ cap.teamId=null; }

  // Remove team from DB
  DB._d.teams=DB.teams.filter(t=>t.id!==teamId);

  // Remove from all matches
  (DB.matches||[]).forEach(m=>{
    if(m.brTeamIds) m.brTeamIds=m.brTeamIds.filter(id=>id!==teamId);
    if(m.teams) m.teams=m.teams.filter(id=>id!==teamId);
    if(m.team1Id===teamId){ m.team1Id=null; m.team1=''; }
    if(m.team2Id===teamId){ m.team2Id=null; m.team2=''; }
    if(m.bannedTeams) m.bannedTeams=m.bannedTeams.filter(id=>id!==teamId);
  });

  // Remove all registrations for this team
  DB._d.registrations=(DB.registrations||[]).filter(r=>r.teamId!==teamId);
  DB._d.requests=(DB.requests||[]).filter(r=>r.teamId!==teamId);

  DB.save();
  showToast('🗑 TEAM DELETED — MEMBERS FREED',false,'ok');
  pTeams(g('mc'));
}

function promote(id){const u=DB.users.find(x=>x.id===id);if(u){u.role='captain';DB.save();pPlayers(g('mc'));showToast('✓ CAPTAIN PROMOTED',false,'ok');}}
function demote(id){const u=DB.users.find(x=>x.id===id);if(u){u.role='player';DB.save();pPlayers(g('mc'));showToast('DEMOTED');}}

    html+=`<div class="xcard"><div class="xcard-t">👑 Captain Role Requests (${roleReqs.length})</div>`;
    if(!roleReqs.length){html+=`<div style="color:var(--muted);font-family:var(--font-mono);font-size:10px;letter-spacing:2px">// NO PENDING REQUESTS</div>`;}
    else roleReqs.forEach(r=>{
      const u=DB.users.find(x=>x.id===r.fromUserId);
      html+=`<div class="req-card"><div><div class="req-from">👤 ${u?.name||'Unknown'}</div><div class="req-meta">IGN: ${u?.ign||'—'} · UID: ${u?.uid||'—'} · 📱 ${u?.phone||'—'}</div><div class="req-meta">Requesting: CAPTAIN role</div></div>
